<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Virtual Bank</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #1a6cf6;
      --blue-dk: #1254c4;
      --green:   #12b76a;
      --red:     #f04438;
      --amber:   #f79009;
      --teal:    #0891b2;
      --bg:      #f4f6fb;
      --card:    #ffffff;
      --border:  #e4e7f0;
      --txt1:    #101828;
      --txt2:    #475467;
      --txt3:    #98a2b3;
      --radius:  14px;
      --shadow:  0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
      --shadow-md: 0 4px 16px rgba(16,24,40,.10);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--txt1);
      min-height: 100vh;
    }

    /* LOADING */
    #loadingOverlay {
      display: none; position: fixed; inset: 0;
      background: rgba(255,255,255,.75); z-index: 9999;
      align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    }
    #loadingOverlay.active { display: flex; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingOverlay span { font-size: .9rem; color: var(--txt2); font-weight: 500; }

    /* LOGIN */
    #loginScreen {
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 0 20px 40px;
    }
    .login-hero {
      width: 100%; background: linear-gradient(135deg, #1254c4 0%, #1a6cf6 100%);
      padding: 56px 24px 64px; text-align: center; color: #fff;
      border-radius: 0 0 32px 32px; margin-bottom: -28px;
    }
    .login-hero .icon {
      width: 60px; height: 60px; background: rgba(255,255,255,.18);
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 16px;
    }
    .login-hero h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.3px; }
    .login-hero p  { font-size: .9rem; opacity: .8; margin-top: 6px; }

    .login-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow-md); padding: 28px 24px;
      width: 100%; max-width: 380px; z-index: 1;
    }
    .login-card h2 { font-size: 1.05rem; font-weight: 600; color: var(--txt1); margin-bottom: 4px; }
    .login-card p  { font-size: .85rem; color: var(--txt2); margin-bottom: 20px; }

    .pin-row { display: flex; gap: 10px; }
    .pin-row input {
      flex: 1; padding: 11px 14px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 1.1rem; letter-spacing: 6px;
      text-align: center; color: var(--txt1); outline: none;
      transition: border-color .2s;
    }
    .pin-row input:focus { border-color: var(--blue); }
    .btn-unlock {
      padding: 11px 22px; background: var(--blue); color: #fff;
      border: none; border-radius: 10px; font-size: .95rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: background .2s;
    }
    .btn-unlock:hover { background: var(--blue-dk); }

    .login-error {
      display: none; margin-top: 10px; padding: 8px 12px;
      background: #fef3f2; border: 1px solid #fecdca; border-radius: 8px;
      color: var(--red); font-size: .84rem;
    }

    .import-section {
      margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);
    }
    .import-section h3 { font-size: .82rem; font-weight: 600; color: var(--txt2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .4px; }
    .import-section .pin-row input { letter-spacing: 4px; font-size: 1rem; }
    .btn-import {
      width: 100%; margin-top: 10px; padding: 10px;
      background: #ecfdf3; color: var(--green); border: 1.5px solid #a9efc5;
      border-radius: 10px; font-size: .9rem; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .btn-import:hover { background: #d1fae5; }
    #importStatus { display: block; margin-top: 8px; font-size: .82rem; color: var(--txt2); min-height: 18px; }

    /* APP */
    #appScreen { display: none; flex-direction: column; min-height: 100vh; }

    .app-header {
      background: linear-gradient(135deg, #1254c4 0%, #1a6cf6 100%);
      padding: 20px 16px 60px; color: #fff;
    }
    .header-top {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    }
    .header-top .app-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -.2px; }
    .sync-pill {
      font-size: .72rem; font-weight: 600; padding: 4px 10px;
      background: rgba(255,255,255,.18); border-radius: 20px;
      white-space: nowrap; min-width: 80px; text-align: center;
    }

    .balance-summary {
      background: rgba(255,255,255,.15); border-radius: 16px;
      padding: 16px 18px; border: 1px solid rgba(255,255,255,.2);
    }
    .balance-summary .label { font-size: .75rem; opacity: .8; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
    .balance-summary .total { font-size: 2rem; font-weight: 700; letter-spacing: -1px; margin: 4px 0 2px; }
    .balance-summary .sub   { font-size: .82rem; opacity: .75; }

    .content {
      padding: 16px; max-width: 600px; width: 100%;
      margin: -36px auto 0; flex: 1;
    }

    .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .add-row input {
      flex: 1; padding: 11px 14px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: .95rem; color: var(--txt1);
      background: var(--card); outline: none; transition: border-color .2s;
      box-shadow: var(--shadow);
    }
    .add-row input:focus { border-color: var(--blue); }
    .add-row .btn-add-user {
      padding: 11px 18px; background: var(--blue); color: #fff;
      border: none; border-radius: 10px; font-size: .9rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; box-shadow: var(--shadow);
      transition: background .2s;
    }
    .add-row .btn-add-user:hover { background: var(--blue-dk); }

    .section-label {
      font-size: .72rem; font-weight: 700; color: var(--txt3);
      text-transform: uppercase; letter-spacing: .8px; margin: 4px 0 10px;
    }

    .user-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1px solid var(--border);
      margin-bottom: 10px; padding: 14px 14px 14px 16px;
      display: flex; align-items: center; gap: 12px;
      transition: box-shadow .2s;
    }
    .user-card:hover { box-shadow: var(--shadow-md); }

    .avatar {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem; font-weight: 700; flex-shrink: 0; color: #fff;
    }
    .av-0{background:#6366f1}.av-1{background:#0891b2}.av-2{background:#d97706}
    .av-3{background:#dc2626}.av-4{background:#7c3aed}.av-5{background:#059669}
    .av-6{background:#db2777}.av-7{background:#2563eb}

    .user-meta { flex: 1; min-width: 0; cursor: pointer; }
    .user-meta .name {
      font-size: .96rem; font-weight: 600; color: var(--txt1);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .user-meta .name:hover { color: var(--blue); }
    .user-meta .bal { font-size: 1.05rem; font-weight: 700; color: var(--blue); margin-top: 2px; }
    .user-meta .bal.neg { color: var(--red); }

    .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 9px; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; transition: background .2s, transform .1s;
    }
    .icon-btn:active { transform: scale(.93); }
    .icon-btn.rn { background: #f5f3ff; color: #7c3aed; }
    .icon-btn.rn:hover { background: #ede9fe; }
    .icon-btn.tr { background: #eff8ff; color: var(--blue); }
    .icon-btn.tr:hover { background: #dbeafe; }
    .icon-btn.dp { background: #ecfdf3; color: var(--green); }
    .icon-btn.dp:hover { background: #d1fae5; }

    /* Toolbar */
    .toolbar {
      position: sticky; bottom: 0;
      background: var(--card); border-top: 1px solid var(--border);
      padding: 10px 8px env(safe-area-inset-bottom, 10px);
      display: flex; gap: 4px; justify-content: center;
      box-shadow: 0 -4px 16px rgba(16,24,40,.07);
    }
    .tb-btn {
      flex: 1; max-width: 90px; padding: 8px 4px; border: none; border-radius: 10px;
      font-size: .68rem; font-weight: 600; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      transition: background .18s, transform .1s; color: var(--txt2); background: transparent;
    }
    .tb-btn:active { transform: scale(.94); }
    .tb-btn .ti { font-size: 1.2rem; line-height: 1; }
    .tb-btn:hover { background: var(--bg); }
    .tb-btn.c-amber{ color: var(--amber); }
    .tb-btn.c-teal { color: var(--teal); }
    .tb-btn.c-blue  { color: var(--blue); }
    .tb-btn.c-red   { color: var(--red); }
    .tb-btn.c-gray  { color: var(--txt3); }

    .guide-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 90px;
    }
    .guide-title {
      font-size: .72rem; font-weight: 700; color: var(--txt2);
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px;
    }
    .guide-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid var(--border); font-size: .86rem;
    }
    .guide-row:last-child { border-bottom: none; }
    .badge {
      font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 20px;
    }
    .bg  { background: #ecfdf3; color: var(--green); }
    .bb  { background: #eff8ff; color: var(--blue); }
    .br  { background: #fef3f2; color: var(--red); }

    /* Popups */
    .popup-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(16,24,40,.4); z-index: 1500;
      overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 16px;
    }
    .popup-box {
      background: var(--card); border-radius: 18px;
      box-shadow: var(--shadow-md); max-width: 400px;
      margin: 8vh auto; padding: 24px; position: relative;
      border: 1px solid var(--border);
    }
    .popup-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    }
    .popup-header h2 { font-size: 1.1rem; font-weight: 700; color: var(--txt1); }
    .popup-close {
      width: 30px; height: 30px; border-radius: 8px; border: none;
      background: var(--bg); cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      color: var(--txt2); transition: background .2s;
    }
    .popup-close:hover { background: var(--border); }

    .popup-form label {
      display: block; font-size: .8rem; font-weight: 600;
      color: var(--txt2); margin-bottom: 5px;
    }
    .popup-form input,
    .popup-form select,
    .popup-form textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: .95rem; color: var(--txt1);
      outline: none; margin-bottom: 14px; transition: border-color .2s;
      background: var(--card); resize: vertical;
    }
    .popup-form input:focus,
    .popup-form select:focus,
    .popup-form textarea:focus { border-color: var(--blue); }
    .popup-form .fr { display: flex; gap: 10px; }
    .popup-form .fr > div { flex: 1; }

    .btn-p {
      width: 100%; padding: 12px; color: #fff; border: none;
      border-radius: 10px; font-size: .95rem; font-weight: 600;
      cursor: pointer; transition: filter .2s;
    }
    .btn-p:hover { filter: brightness(.9); }
    .btn-p.blue  { background: var(--blue); }
    .btn-p.green { background: var(--green); }
    .btn-p.red   { background: var(--red); }
    .btn-p.amber { background: var(--amber); }
    .btn-p.gray  { background: var(--bg); color: var(--txt2); border: 1px solid var(--border); }

    .range-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .range-pill {
      padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--bg); font-size: .78rem; font-weight: 600; color: var(--txt2);
      cursor: pointer; transition: all .15s;
    }
    .range-pill:hover, .range-pill.active {
      background: var(--blue); color: #fff; border-color: var(--blue);
    }
    .stmt-summary {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .stmt-chip {
      flex: 1; background: var(--bg); border-radius: 10px;
      padding: 8px 10px; text-align: center;
    }
    .stmt-chip .sc-label { font-size: .68rem; font-weight: 600; color: var(--txt3); text-transform: uppercase; }
    .stmt-chip .sc-val   { font-size: .95rem; font-weight: 700; margin-top: 2px; }
    .stmt-wrap { overflow-x: auto; margin-top: 12px; border-radius: 10px; border: 1px solid var(--border); }
    .statement-table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    .statement-table th {
      background: var(--bg); padding: 8px 10px; text-align: left;
      font-weight: 600; color: var(--txt2); font-size: .76rem;
      border-bottom: 1px solid var(--border);
    }
    .statement-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .statement-table tr:last-child td { border-bottom: none; }
    .tag { font-size: .7rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
    .tcr { background: #ecfdf3; color: var(--green); }
    .tdr { background: #fef3f2; color: var(--red); }

    @media (min-width: 480px) {
      .content { padding: 20px; }
      .app-header { padding: 24px 24px 64px; }
    }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <span id="loadingMsg">Syncing…</span>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-hero">
    <div class="icon">🏦</div>
    <h1>Virtual Bank</h1>
    <p>Family allowance tracker</p>
  </div>
  <div class="login-card">
    <h2>Welcome back</h2>
    <p>Enter your shared PIN to continue</p>
    <div class="pin-row">
      <input id="pinInput" type="password" inputmode="numeric" placeholder="••••" autocomplete="off"/>
      <button class="btn-unlock" onclick="doLogin()">Unlock</button>
    </div>
    <div class="login-error" id="loginError">Incorrect PIN — please try again.</div>

    <div class="import-section">
      <h3>First-time setup — import existing backup</h3>
      <div class="pin-row">
        <input id="pinForImport" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"/>
      </div>
      <button class="btn-import" onclick="document.getElementById('importFileInput').click()">
        📂 Import backup JSON
      </button>
      <input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="importAndUpload(event)"/>
      <span id="importStatus"></span>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <div class="app-header">
    <div class="header-top">
      <span class="app-title">🏦 Virtual Bank</span>
      <span class="sync-pill" id="syncStatus">—</span>
    </div>
    <div class="balance-summary">
      <div class="label">Total balance</div>
      <div class="total" id="totalBalance">₹0</div>
      <div class="sub" id="userCount">0 accounts</div>
    </div>
  </div>

  <div class="content">
    <div class="add-row">
      <input id="newUserName" type="text" placeholder="New account name…"/>
      <button class="btn-add-user" onclick="addUser()">+ Add</button>
    </div>
    <div class="section-label">Accounts</div>
    <div id="userList"></div>

    <!--<div class="guide-card">
      <div class="guide-title">Allowance guide</div>
      <div class="guide-row"><span>Great Job</span><span class="badge bg">₹50 or 1 hr screen</span></div>
      <div class="guide-row"><span>Bedrock</span><span class="badge bg">₹20</span></div>
      <div class="guide-row"><span>Well Done (without telling)</span><span class="badge bg">₹15</span></div>
      <div class="guide-row"><span>Star (after telling)</span><span class="badge bb">₹10</span></div>
      <div class="guide-row"><span>Nice Effort (tried)</span><span class="badge bb">₹5</span></div>
      <div class="guide-row"><span>Weapons</span><span class="badge br">−₹5</span></div>
    </div>
  </div>-->
  <div id="remarksSummaryCard" class="guide-card" style="display: none;"></div>

  <div class="toolbar">
    <button class="tb-btn c-amber" onclick="openStatementReport()"><span class="ti">📋</span>Statement</button>
    <button class="tb-btn c-teal"  onclick="exportData()"><span class="ti">⬇️</span>Export</button>
    <button class="tb-btn c-blue"  onclick="syncNow()"><span class="ti">🔄</span>Refresh</button>
    <button class="tb-btn c-red"   onclick="openDeletePopup()"><span class="ti">🗑️</span>Delete</button>
    <button class="tb-btn c-gray"  onclick="logout()"><span class="ti">🔒</span>Lock</button>
  </div>
</div>

<div id="popupBg" class="popup-bg"></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxIrARpwwIMGn1F1AVv7LuwZW-r0UqhsF-0yEVNegUOJQlgksVnzcn5looGcP3XheSAJQ/exec";

  let users = [], transactions = [], userPIN = "";

  document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key==="Enter") doLogin(); });

  async function doLogin() {
    const pin = document.getElementById("pinInput").value.trim();
    if (!pin) return;
    userPIN = pin;
    setLoading(true, "Syncing data…");
    document.getElementById("loginError").style.display = "none";
    try {
      const data = await apiGet();
      if (data.error === "Unauthorized") {
        document.getElementById("loginError").style.display = "block";
        userPIN = ""; setLoading(false); return;
      }
      users = data.users||[]; transactions = data.transactions||[];
      showApp(); setSyncStatus("✅ Synced");
    } catch {
      const cached = localStorage.getItem("vb_cache_"+pin);
      if (cached) {
        const d = JSON.parse(cached);
        users = d.users||[]; transactions = d.transactions||[];
        showApp(); setSyncStatus("⚠️ Offline");
        alert("Cannot reach server — showing cached data.");
      } else {
        document.getElementById("loginError").textContent = "Cannot connect. Check internet.";
        document.getElementById("loginError").style.display = "block";
        userPIN = "";
      }
    }
    setLoading(false);
  }

  function showApp() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appScreen").style.display = "flex";
    renderUsers();
  }
  function logout() {
    userPIN=""; users=[]; transactions=[];
    document.getElementById("pinInput").value = "";
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("appScreen").style.display = "none";
  }

  async function apiGet() {
    const r = await fetch(`${API_URL}?pin=${encodeURIComponent(userPIN)}`); return r.json();
  }
  async function apiSave() {
    const r = await fetch(API_URL,{method:"POST",body:JSON.stringify({pin:userPIN,users,transactions}),headers:{"Content-Type":"text/plain"}});
    return r.json();
  }
  async function saveData() {
    localStorage.setItem("vb_cache_"+userPIN, JSON.stringify({users,transactions}));
    setSyncStatus("⏳ Saving…");
    try { const r=await apiSave(); setSyncStatus(r.success?"✅ Saved":"⚠️ Error"); }
    catch { setSyncStatus("⚠️ Offline"); }
  }
  async function syncNow() {
    setLoading(true,"Refreshing…");
    try {
      const d=await apiGet();
      if(d.error){alert("Sync failed: "+d.error);setLoading(false);return;}
      users=d.users||[]; transactions=d.transactions||[];
      localStorage.setItem("vb_cache_"+userPIN,JSON.stringify({users,transactions}));
      renderUsers(); setSyncStatus("✅ Synced");
    } catch { setSyncStatus("⚠️ Offline"); }
    setLoading(false);
  }

  const AV = ["av-0","av-1","av-2","av-3","av-4","av-5","av-6","av-7"];
  function ini(name){ return name.trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase(); }

  function renderUsers() {
    const list = document.getElementById("userList");
    list.innerHTML = "";
    const total = users.reduce((s,u)=>s+u.balance,0);
    document.getElementById("totalBalance").textContent = "₹"+total.toLocaleString("en-IN");
    document.getElementById("userCount").textContent = users.length+" account"+(users.length!==1?"s":"");
    users.forEach((u,i)=>{
      const neg = u.balance<0;
      list.innerHTML += `
        <div class="user-card">
          <div class="avatar ${AV[i%8]}">${ini(u.name)}</div>
          <div class="user-meta" onclick="openStatementFor(${u.id})" title="View statement">
            <div class="name">${escapeHtml(u.name)}</div>
            <div class="bal${neg?" neg":""}">₹${u.balance.toLocaleString("en-IN")}</div>
          </div>
          <div class="card-actions">
            <button class="icon-btn rn" onclick="openRenamePopup(${u.id})" title="Rename">✎</button>
            <button class="icon-btn tr" onclick="openTransaction(${u.id})" title="Transfer">⇄</button>
            <button class="icon-btn dp" onclick="openDepositPopup(${u.id})" title="Deposit">＋</button>
          </div>
        </div>`;
    });
    renderRemarksSummary();
  }

  function renderRemarksSummary() {
    const card = document.getElementById("remarksSummaryCard");
    const keywordSummary = {};
    let hasRemarks = false;

    // Common words to ignore when extracting keywords
    const stopWords = new Set(["and", "the", "for", "from", "with", "into", "this", "that", "via", "got", "paid"]);

    transactions.forEach(t => {
      const remark = (t.remarks || "").trim();
      if (!remark) return;

      // Extract alphanumeric words and convert to lowercase
      const words = remark.toLowerCase().match(/[a-z0-9]+/g) || [];
      
      // Use a Set to ensure a word is only counted once per transaction 
      // (e.g., "Amazon refund for Amazon purchase" only counts 'Amazon' once)
      const uniqueWords = new Set(words);

      uniqueWords.forEach(word => {
        // Skip short words (<= 2 chars) and defined stop words
        if (word.length <= 2 || stopWords.has(word)) return;
        
        // Capitalize the first letter for clean display
        const displayWord = word.charAt(0).toUpperCase() + word.slice(1);
        
        if (!keywordSummary[displayWord]) keywordSummary[displayWord] = 0;
        keywordSummary[displayWord] += t.amount;
        hasRemarks = true;
      });
    });

    if (!hasRemarks) {
      card.style.display = "none";
      return;
    }

    // Sort keywords by highest monetary volume (absolute value)
    const sortedKeywords = Object.keys(keywordSummary).sort((a, b) => 
      Math.abs(keywordSummary[b]) - Math.abs(keywordSummary[a])
    );

    // Limit to the top 10 keywords to keep the UI clean
    const topKeywords = sortedKeywords.slice(0, 50);

    let html = `<div class="guide-title">Keyword Summary</div>`;
    
    topKeywords.forEach(word => {
      const total = keywordSummary[word];
      const badgeClass = total >= 0 ? "bg" : "br";
      const sign = total >= 0 ? "₹" : "−₹";
      
      html += `
        <div class="guide-row">
          <span>${escapeHtml(word)}</span>
          <span class="badge ${badgeClass}">${sign}${Math.abs(total).toLocaleString("en-IN")}</span>
        </div>`;
    });

    card.innerHTML = html;
    card.style.display = "block";
  }

  function addUser() {
    const inp=document.getElementById("newUserName"), name=inp.value.trim();
    if(!name) return;
    users.push({id:Date.now(),name,balance:0}); inp.value=""; saveData(); renderUsers();
  }
  function openRenamePopup(id) {
    const u=users.find(u=>u.id===id); if(!u) return;
    showPopup(`
      <div class="popup-header"><h2>Rename account</h2><button class="popup-close" onclick="closePopup()">✕</button></div>
      <form class="popup-form" onsubmit="renameAccount(event,${id})">
        <label>Account name</label>
        <input type="text" name="newName" value="${escapeHtml(u.name)}" required maxlength="50" autofocus/>
        <button class="btn-p blue" type="submit">Save</button>
      </form>`);
  }
  function renameAccount(e,id) {
    e.preventDefault();
    const u=users.find(u=>u.id===id); if(!u) return;
    u.name=e.target.newName.value.trim()||u.name;
    saveData(); renderUsers(); closePopup();
  }
  function openDeletePopup() {
    if(!users.length){alert("No accounts to delete.");return;}
    const opts=users.map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join("");
    showPopup(`
      <div class="popup-header"><h2>Delete account</h2><button class="popup-close" onclick="closePopup()">✕</button></div>
      <form class="popup-form" onsubmit="confirmDeleteUser(event)">
        <label>Select account</label>
        <select name="userId" required>${opts}</select>
        <button class="btn-p red" type="submit">Delete account</button>
      </form>`);
  }
  function confirmDeleteUser(e) {
    e.preventDefault();
    const id=Number(new FormData(e.target).get("userId"));
    const u=users.find(u=>u.id===id); if(!u) return;
    e.target.innerHTML=`
      <p style="font-size:.9rem;color:var(--txt2);margin-bottom:16px;">Delete <strong>${escapeHtml(u.name)}</strong>'s account and all their transactions?</p>
      <div style="display:flex;gap:10px;">
        <button class="btn-p gray" onclick="closePopup();return false;">Cancel</button>
        <button class="btn-p red"  onclick="deleteUser(${id});return false;">Yes, delete</button>
      </div>`;
  }
  function deleteUser(id) {
    users=users.filter(u=>u.id!==id);
    transactions=transactions.filter(t=>t.from!==id&&t.to!==id);
    saveData(); closePopup(); renderUsers();
  }

  function openTransaction(fromId) {
    const opts=users.filter(u=>u.id!==fromId).map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join("");
    showPopup(`
      <div class="popup-header"><h2>Transfer</h2><button class="popup-close" onclick="closePopup()">✕</button></div>
      <form class="popup-form" onsubmit="submitTransaction(event,${fromId})">
        <label>Transfer to</label>
        <select name="to" required>${opts}</select>
        <div class="fr">
          <div><label>Date</label><input type="date" name="date" required value="${todayStr()}"/></div>
          <div><label>Amount (₹)</label><input type="number" name="amount" required/></div>
        </div>
        <label>Remarks</label>
        <textarea name="remarks" rows="2" placeholder="Optional"></textarea>
        <button class="btn-p blue" type="submit">Transfer</button>
      </form>`);
  }
  function submitTransaction(e,fromId) {
    e.preventDefault();
    const d=Object.fromEntries(new FormData(e.target)), amt=Number(d.amount);
    const from=users.find(u=>u.id===fromId), to=users.find(u=>u.id==d.to);
    if(!from||!to) return;
    from.balance-=amt; to.balance+=amt;
    transactions.push({from:fromId,to:Number(d.to),date:d.date,amount:amt,remarks:d.remarks});
    saveData(); closePopup(); renderUsers();
  }

  function openDepositPopup(uid) {
    const u=users.find(u=>u.id===uid); if(!u) return;
    showPopup(`
      <div class="popup-header"><h2>Deposit — ${escapeHtml(u.name)}</h2><button class="popup-close" onclick="closePopup()">✕</button></div>
      <form class="popup-form" onsubmit="submitDeposit(event,${uid})">
        <div class="fr">
          <div><label>Date</label><input type="date" name="date" required value="${todayStr()}" autofocus/></div>
          <div><label>Amount (₹)</label><input type="number" name="amount" required/></div>
        </div>
        <label>Remarks</label>
        <textarea name="remarks" rows="2" placeholder="Optional"></textarea>
        <button class="btn-p green" type="submit">Deposit</button>
      </form>`);
  }
  function submitDeposit(e,uid) {
    e.preventDefault();
    const d=Object.fromEntries(new FormData(e.target)), amt=Number(d.amount);
    const u=users.find(u=>u.id===uid); if(!u) return;
    u.balance+=amt;
    transactions.push({from:null,to:uid,date:d.date,amount:amt,remarks:d.remarks});
    saveData(); closePopup(); renderUsers();
  }

  function openStatementFor(preselectedId) {
    if(!users.length){alert("No accounts available.");return;}
    const opts=users.map(u=>`<option value="${u.id}"${u.id===preselectedId?" selected":""}>${escapeHtml(u.name)}</option>`).join("");
    const {from,to} = rangeFor("month");
    showPopup(`
      <div class="popup-header"><h2>Statement</h2><button class="popup-close" onclick="closePopup()">✕</button></div>
      <form class="popup-form" id="stmtForm" onsubmit="showStatementReport(event)">
        <label>Account</label>
        <select name="userId" required>${opts}</select>
        <label>Quick range</label>
        <div class="range-pills">
          <span class="range-pill active" onclick="applyRange(this,'month')">This month</span>
          <span class="range-pill" onclick="applyRange(this,'lastmonth')">Last month</span>
          <span class="range-pill" onclick="applyRange(this,'3months')">3 months</span>
          <span class="range-pill" onclick="applyRange(this,'6months')">6 months</span>
          <span class="range-pill" onclick="applyRange(this,'year')">This year</span>
          <span class="range-pill" onclick="applyRange(this,'all')">All time</span>
        </div>
        <div class="fr">
          <div><label>From</label><input type="date" name="from" required id="stmtFrom" value="${from}"/></div>
          <div><label>To</label><input type="date" name="to" required id="stmtTo" value="${to}"/></div>
        </div>
        <button class="btn-p amber" type="submit">Show statement</button>
      </form>
      <div id="statementResult"></div>`);
  }

  function openStatementReport() { openStatementFor(null); }

  function rangeFor(key) {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const pad = n => String(n).padStart(2,"0");
    const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    if (key==="month")     return { from: `${y}-${pad(m+1)}-01`, to: fmt(now) };
    if (key==="lastmonth") {
      const f = new Date(y, m-1, 1), t = new Date(y, m, 0);
      return { from: fmt(f), to: fmt(t) };
    }
    if (key==="3months")   return { from: fmt(new Date(y, m-2, 1)), to: fmt(now) };
    if (key==="6months")   return { from: fmt(new Date(y, m-5, 1)), to: fmt(now) };
    if (key==="year")      return { from: `${y}-01-01`, to: fmt(now) };
    if (key==="all")       return { from: "2000-01-01", to: fmt(now) };
    return { from: fmt(now), to: fmt(now) };
  }

  function applyRange(el, key) {
    document.querySelectorAll(".range-pill").forEach(p=>p.classList.remove("active"));
    el.classList.add("active");
    const {from,to} = rangeFor(key);
    document.getElementById("stmtFrom").value = from;
    document.getElementById("stmtTo").value   = to;
  }

  function showStatementReport(e) {
    e.preventDefault();
    const d=Object.fromEntries(new FormData(e.target)), uid=Number(d.userId);
    const u=users.find(u=>u.id===uid); if(!u) return;
    const trs=transactions.filter(t=>(t.from===uid||t.to===uid)&&t.date>=d.from&&t.date<=d.to);
    const totalCr = trs.filter(t=>t.from!==uid).reduce((s,t)=>s+t.amount,0);
    const totalDr = trs.filter(t=>t.from===uid).reduce((s,t)=>s+t.amount,0);
    let rows=trs.map(t=>{
      const cr=t.from!==uid;
      const other=t.from===null?"Deposit":(users.find(u=>u.id===(cr?t.from:t.to))?.name||"—");
      return `<tr>
        <td>${t.date}</td>
        <td><span class="tag ${cr?"tcr":"tdr"}">${cr?"Credit":"Debit"}</span></td>
        <td>${escapeHtml(other)}</td>
        <td style="font-weight:600;color:${cr?"var(--green)":"var(--red)"}">
          ${cr?"+":"−"}₹${t.amount.toLocaleString("en-IN")}
        </td>
        <td style="color:var(--txt3)">${escapeHtml(t.remarks||"")}</td>
      </tr>`;
    }).join("");
    if(!rows) rows=`<tr><td colspan="5" style="text-align:center;color:var(--txt3);padding:16px">No transactions in this period</td></tr>`;
    e.target.nextElementSibling.innerHTML=`
      <div class="stmt-summary">
        <div class="stmt-chip">
          <div class="sc-label">Credits</div>
          <div class="sc-val" style="color:var(--green)">+₹${totalCr.toLocaleString("en-IN")}</div>
        </div>
        <div class="stmt-chip">
          <div class="sc-label">Debits</div>
          <div class="sc-val" style="color:var(--red)">−₹${totalDr.toLocaleString("en-IN")}</div>
        </div>
        <div class="stmt-chip">
          <div class="sc-label">Net</div>
          <div class="sc-val" style="color:var(--blue)">₹${(totalCr-totalDr).toLocaleString("en-IN")}</div>
        </div>
      </div>
      <div class="stmt-wrap">
        <table class="statement-table">
          <thead><tr><th>Date</th><th>Type</th><th>With</th><th>Amount</th><th>Note</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function importAndUpload(event) {
    const file=event.target.files[0]; if(!file) return;
    const pin=document.getElementById("pinForImport").value.trim();
    if(!pin){document.getElementById("importStatus").textContent="⚠️ Enter PIN first.";event.target.value="";return;}
    const reader=new FileReader();
    reader.onload=async(e)=>{
      let data;
      try {
        data=JSON.parse(e.target.result);
        if(!Array.isArray(data.users)||!Array.isArray(data.transactions)) throw new Error("Invalid backup format.");
      } catch(err){document.getElementById("importStatus").textContent="❌ "+err.message;event.target.value="";return;}
      document.getElementById("importStatus").textContent="⏳ Uploading…";
      setLoading(true,"Importing…");
      try {
        const res=await fetch(API_URL,{method:"POST",body:JSON.stringify({pin,users:data.users,transactions:data.transactions}),headers:{"Content-Type":"text/plain"}});
        const result=await res.json();
        if(result.error==="Unauthorized") document.getElementById("importStatus").textContent="❌ Wrong PIN.";
        else if(result.success) {
          document.getElementById("importStatus").textContent=`✅ Imported ${data.users.length} accounts & ${data.transactions.length} transactions. Unlock above.`;
          document.getElementById("pinInput").value=pin;
        } else document.getElementById("importStatus").textContent="❌ Upload failed.";
      } catch(err){document.getElementById("importStatus").textContent="❌ "+err.message;}
      setLoading(false); event.target.value="";
    };
    reader.readAsText(file);
  }

  function exportData() {
    try {
      const blob=new Blob([JSON.stringify({users,transactions},null,2)],{type:"application/json"});
      const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:`virtual_bank_backup_${todayStr()}.json`,style:"display:none"});
      document.body.appendChild(a); a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(a.href);},200);
      setSyncStatus("✅ Exported");
    } catch(err){alert("Export failed: "+err.message);}
  }

  function showPopup(html) {
    const bg=document.getElementById("popupBg");
    bg.innerHTML=`<div class="popup-box">${html}</div>`;
    bg.style.display="block";
  }
  function closePopup(){ document.getElementById("popupBg").style.display="none"; }
  function setSyncStatus(msg){ document.getElementById("syncStatus").textContent=msg; }
  function setLoading(on,msg="Syncing…"){
    document.getElementById("loadingMsg").textContent=msg;
    document.getElementById("loadingOverlay").classList.toggle("active",on);
  }
  function todayStr(){
    const d=new Date(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");
    return `${d.getFullYear()}-${m}-${dd}`;
  }
  function escapeHtml(t){
    if(!t) return "";
    return t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);
  }
</script>
