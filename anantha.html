<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anantha | Financial Goals V1.6</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --surface-color: #1a1d24;
            --surface-light: #252a34;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --danger-color: #f43f5e;
            --warning-color: #fbbf24;
            --edu-color: #a78bfa;
            --success-color: #34d399;
            --border-color: #2dd4bf20;
            --font-family: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-name { font-size: 1.5rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        .version { color: var(--text-secondary); font-family: monospace; }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
        }

        @media (max-width: 800px) {
            .dashboard-layout { grid-template-columns: 1fr; }
        }

        /* Form Styles */
        .form-card { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; height: fit-content; }
        .form-card h2 { font-size: 1.1rem; margin-bottom: 1.5rem; color: var(--accent-color); }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.875rem; color: var(--text-secondary); }
        .form-group input, .form-group select { width: 100%; background: var(--surface-light); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.75rem; border-radius: 4px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent-color); }
        .form-actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; }

        .row-group { display: flex; gap: 1rem; }
        .row-group > div { flex: 1; }

        button { flex: 1; background-color: var(--accent-color); color: #000; border: none; padding: 0.75rem; border-radius: 4px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-cancel { background-color: var(--surface-light); color: var(--text-primary); border: 1px solid var(--border-color); display: none; }

        /* Goals Grid */
        .goals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        
        .goal-card { 
            background-color: var(--surface-color); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 1.5rem; 
            display: flex; 
            flex-direction: column; 
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .goal-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.3); border-color: var(--accent-color); }
        
        .goal-card.retirement-type { border-top: 3px solid var(--warning-color); }
        .goal-card.education-type { border-top: 3px solid var(--edu-color); }
        
        .goal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--surface-light); }
        .goal-title { font-weight: 600; font-size: 1.1rem; }
        .goal-type-badge { font-size: 0.7rem; background: var(--surface-light); padding: 0.2rem 0.5rem; border-radius: 4px; color: var(--text-secondary); margin-left: 0.5rem; vertical-align: middle;}
        
        .card-actions { display: flex; gap: 0.75rem; z-index: 10; }
        .icon-btn { background: none; color: var(--text-secondary); width: auto; padding: 0; font-size: 1.1rem; }
        .icon-btn:hover { color: var(--accent-color); }
        .icon-btn.delete:hover { color: var(--danger-color); }
        
        .goal-stat { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .goal-stat span:first-child { color: var(--text-secondary); }
        
        .instrument-box { margin-top: auto; padding: 1rem; background-color: rgba(56, 189, 248, 0.05); border-left: 3px solid var(--accent-color); border-radius: 0 4px 4px 0; font-size: 0.85rem; margin-bottom: 1rem; }
        .instrument-box span { color: var(--text-secondary); display: block; margin-bottom: 0.25rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;}
        .instrument-box strong { color: var(--accent-color); font-weight: 500; }

        .value-tiers { display: flex; flex-direction: column; gap: 1rem; padding-top: 1rem; border-top: 1px dotted var(--surface-light); }
        .value-tier { display: flex; justify-content: space-between; align-items: flex-end; }
        .value-tier span { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }
        .tier-value { font-weight: 700; }
        .tier-value.pv { font-size: 1.1rem; color: var(--text-primary); }
        .tier-value.fv { font-size: 1.4rem; color: var(--accent-color); }

        .investment-status { margin-top: 1rem; padding: 0.75rem; background: var(--surface-light); border-radius: 6px; font-size: 0.85rem; }
        .investment-header { display: flex; justify-content: space-between; margin-bottom: 0.4rem; }
        .investment-amount { color: var(--success-color); font-weight: 600; }
        .user-instrument { color: var(--text-secondary); font-size: 0.75rem; font-style: italic; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content {
            background: var(--surface-color); padding: 2rem; border-radius: 8px;
            width: 90%; max-width: 400px; border: 1px solid var(--border-color);
            position: relative;
        }
        .modal-content h3 { margin-bottom: 1.5rem; color: var(--accent-color); }
        .close-modal { position: absolute; top: 1rem; right: 1rem; background: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; border: none; padding: 0; width: auto; }
        .close-modal:hover { color: var(--danger-color); }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">Anantha</div>
        <div class="version">v1.6 (Tracking & Present Value)</div>
    </header>

    <div class="dashboard-layout">
        <!-- Input Form -->
        <aside class="form-card">
            <h2 id="formTitle">Define New Goal</h2>
            <form id="goalForm">
                <div class="form-group">
                    <label for="goalType">Goal Type</label>
                    <select id="goalType" onchange="app.toggleFormFields()">
                        <option value="standard">Standard Financial Goal</option>
                        <option value="retirement">Retirement Corpus</option>
                        <option value="education">Kids Education Timeline</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="goalName">Goal Name</label>
                    <input type="text" id="goalName" required placeholder="e.g., Higher Education">
                </div>

                <!-- Standard Fields -->
                <div id="standardFields">
                    <div class="form-group">
                        <label for="currentValue">Current Budgeted Value (₹)</label>
                        <input type="number" id="currentValue" placeholder="1000000" min="0" step="any">
                    </div>
                    <div class="form-group">
                        <label for="years">Years Till Closure</label>
                        <input type="number" id="years" placeholder="8" min="1" max="100">
                    </div>
                </div>

                <!-- Retirement Fields -->
                <div id="retirementFields" style="display: none;">
                    <div class="form-group">
                        <label for="monthlyExpenses">Current Monthly Expenses (₹)</label>
                        <input type="number" id="monthlyExpenses" placeholder="50000" min="0" step="any">
                    </div>
                    <div class="form-group">
                        <label for="yearsToRetire">Years To Retirement</label>
                        <input type="number" id="yearsToRetire" placeholder="15" min="1" max="50">
                    </div>
                    <div class="form-group">
                        <label for="yearsInRetirement">Years In Retirement (Duration)</label>
                        <input type="number" id="yearsInRetirement" placeholder="25" min="1" max="50">
                    </div>
                    <div class="form-group">
                        <label for="postRetirementReturn">Expected Post-Retirement Return (%)</label>
                        <input type="number" id="postRetirementReturn" placeholder="8" min="0" max="100" step="0.1">
                    </div>
                </div>

                <!-- Education Fields -->
                <div id="educationFields" style="display: none;">
                    <div class="form-group row-group">
                        <div>
                            <label for="eduChildren">No. of Children</label>
                            <input type="number" id="eduChildren" value="2" min="1" max="10">
                        </div>
                        <div>
                            <label for="eduGrade">Current Grade (1-12)</label>
                            <input type="number" id="eduGrade" value="4" min="1" max="12">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="eduCurrentFees">Current Yearly Fees (per child) (₹)</label>
                        <input type="number" id="eduCurrentFees" placeholder="150000" min="0" step="any">
                    </div>
                    <div class="form-group">
                        <label for="eduCost11_12">11th & 12th Cost (Today's Value/child) (₹)</label>
                        <input type="number" id="eduCost11_12" placeholder="400000" min="0" step="any">
                    </div>
                    <div class="form-group">
                        <label for="eduCostDegree">Degree Total Cost (Today's Value/child) (₹)</label>
                        <input type="number" id="eduCostDegree" placeholder="1500000" min="0" step="any">
                    </div>
                    <div class="form-group">
                        <label for="eduCostHigher">Higher Studies (Today's Value/child) (₹)</label>
                        <input type="number" id="eduCostHigher" placeholder="2500000" min="0" step="any">
                    </div>
                </div>

                <!-- Shared Field: Inflation -->
                <div class="form-group">
                    <label id="inflationLabel" for="inflation">Expected YoY Inflation (%)</label>
                    <input type="number" id="inflation" required placeholder="6" min="0" max="100" step="0.1">
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn">Calculate & Save</button>
                    <button type="button" id="cancelBtn" class="btn-cancel" onclick="app.cancelEdit()">Cancel</button>
                </div>
            </form>
        </aside>

        <!-- Goals Display Area -->
        <main>
            <div class="goals-grid" id="goalsContainer">
                <!-- Goal cards injected here -->
            </div>
        </main>
    </div>

    <!-- Investment Modal -->
    <div class="modal-overlay" id="investModal">
        <div class="modal-content">
            <button class="close-modal" onclick="app.closeModal()">✕</button>
            <h3 id="modalGoalName">Track Investment</h3>
            <form id="investForm" onsubmit="app.saveInvestment(event)">
                <input type="hidden" id="modalGoalId">
                <div class="form-group">
                    <label for="investAmount">Existing Invested Value (₹)</label>
                    <input type="number" id="investAmount" required placeholder="50000" min="0" step="any">
                </div>
                <div class="form-group">
                    <label for="investInstrument">Instrument Type / Account</label>
                    <input type="text" id="investInstrument" required placeholder="e.g., HDFC Flexi-Cap MF, SBI FD">
                </div>
                <button type="submit" style="background-color: var(--success-color);">Update Portfolio</button>
            </form>
        </div>
    </div>

    <script>
        const app = {
            goals: [],
            editingId: null,

            init() {
                // Key upgraded to V1_6
                const savedGoals = localStorage.getItem('ananthaGoalsV1_6');
                if (savedGoals) {
                    this.goals = JSON.parse(savedGoals);
                }
                document.getElementById('goalForm').addEventListener('submit', (e) => this.handleSave(e));
                this.toggleFormFields();
                this.render();
            },

            formatCurrency(amount) {
                return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount);
            },

            toggleFormFields() {
                const type = document.getElementById('goalType').value;
                const standardFields = document.getElementById('standardFields');
                const retirementFields = document.getElementById('retirementFields');
                const educationFields = document.getElementById('educationFields');
                const inflationLabel = document.getElementById('inflationLabel');

                document.getElementById('currentValue').required = false;
                document.getElementById('years').required = false;
                document.getElementById('monthlyExpenses').required = false;
                document.getElementById('yearsToRetire').required = false;
                document.getElementById('yearsInRetirement').required = false;
                document.getElementById('postRetirementReturn').required = false;
                document.getElementById('eduCurrentFees').required = false;
                document.getElementById('eduCostDegree').required = false;

                if (type === 'standard') {
                    standardFields.style.display = 'block';
                    retirementFields.style.display = 'none';
                    educationFields.style.display = 'none';
                    inflationLabel.innerText = "Expected YoY Inflation (%)";
                    document.getElementById('currentValue').required = true;
                    document.getElementById('years').required = true;
                } else if (type === 'retirement') {
                    standardFields.style.display = 'none';
                    retirementFields.style.display = 'block';
                    educationFields.style.display = 'none';
                    inflationLabel.innerText = "Expected YoY Inflation (%)";
                    document.getElementById('monthlyExpenses').required = true;
                    document.getElementById('yearsToRetire').required = true;
                    document.getElementById('yearsInRetirement').required = true;
                    document.getElementById('postRetirementReturn').required = true;
                    if(!document.getElementById('goalName').value) document.getElementById('goalName').value = "Retirement Fund";
                } else if (type === 'education') {
                    standardFields.style.display = 'none';
                    retirementFields.style.display = 'none';
                    educationFields.style.display = 'block';
                    inflationLabel.innerText = "Expected Education Fee Inflation (%)";
                    document.getElementById('eduCurrentFees').required = true;
                    document.getElementById('eduCostDegree').required = true;
                    if(!document.getElementById('goalName').value) document.getElementById('goalName').value = "Kids Education Fund";
                }
            },

            // Calculations
            calcRetirementPV(monthlyExp, yearsInRetirement, inflationRate, returnRate) {
                const annualExp = monthlyExp * 12;
                const rRate = returnRate / 100;
                const iRate = inflationRate / 100;
                const realReturn = ((1 + rRate) / (1 + iRate)) - 1;

                if (realReturn <= 0) return annualExp * yearsInRetirement;
                return annualExp * ((1 - Math.pow(1 + realReturn, -yearsInRetirement)) / realReturn) * (1 + realReturn);
            },

            calcRetirementFV(monthlyExp, yearsToRetire, yearsInRetirement, inflationRate, returnRate) {
                const annualExp = monthlyExp * 12;
                const expAtRetirement = annualExp * Math.pow((1 + (inflationRate / 100)), yearsToRetire);
                const rRate = returnRate / 100;
                const iRate = inflationRate / 100;
                const realReturn = ((1 + rRate) / (1 + iRate)) - 1;

                if (realReturn <= 0) return expAtRetirement * yearsInRetirement;
                return expAtRetirement * ((1 - Math.pow(1 + realReturn, -yearsInRetirement)) / realReturn) * (1 + realReturn);
            },

            calcEducationPV(children, grade, currentFees, cost11_12, costDegree, costHigher) {
                let yearsTo10 = Math.max(0, 10 - grade);
                let totalToday = (yearsTo10 * currentFees) + cost11_12 + costDegree + costHigher;
                return totalToday * children;
            },

            calcEducationFV(children, grade, currentFees, eduInf, cost11_12, costDegree, costHigher) {
                const r = eduInf / 100;
                let currentYearFee = currentFees;
                let schoolingCost = 0;
                
                let yearsTo10 = Math.max(0, 10 - grade);
                for (let i = 1; i <= yearsTo10; i++) {
                    currentYearFee = currentYearFee * (1 + r);
                    schoolingCost += currentYearFee;
                }

                let yearsTo11 = Math.max(0, 11 - grade);
                let futureCost11_12 = cost11_12 ? (cost11_12 * Math.pow(1 + r, yearsTo11)) : 0;

                let yearsToDegree = Math.max(0, 13 - grade);
                let futureCostDegree = costDegree ? (costDegree * Math.pow(1 + r, yearsToDegree)) : 0;

                let yearsToHigher = Math.max(0, 16 - grade);
                let futureCostHigher = costHigher ? (costHigher * Math.pow(1 + r, yearsToHigher)) : 0;

                let totalPerChild = schoolingCost + futureCost11_12 + futureCostDegree + futureCostHigher;
                return totalPerChild * children;
            },

            suggestInstrument(type, years) {
                if (type === 'retirement') return "Index Funds + EPF/PPF (Accumulation) ➔ SWP + SCSS (Withdrawal)";
                if (type === 'education') {
                    if (years <= 3) return "Arbitrage Funds & FDs. Shift degree funds here soon.";
                    if (years <= 7) return "Balanced Advantage Funds (for approaching degree costs).";
                    return "Flexi-Cap Equity MFs & Nifty 50 Index. Shift to Debt 3 yrs before college.";
                }
                if (years <= 3) return "Liquid Mutual Funds, Bank FDs, or Arbitrage Funds";
                if (years <= 7) return "Balanced Advantage Funds or Aggressive Hybrid Funds";
                return "Flexi-Cap Equity MFs & Nifty 50 Index Funds (Wealth Creation)";
            },

            handleSave(event) {
                event.preventDefault();

                const type = document.getElementById('goalType').value;
                const name = document.getElementById('goalName').value;
                const inflation = parseFloat(document.getElementById('inflation').value);

                // Preserve existing investment data if editing
                let existingInvested = 0;
                let existingInstrument = "";
                if (this.editingId) {
                    const existingGoal = this.goals.find(g => g.id === this.editingId);
                    if (existingGoal) {
                        existingInvested = existingGoal.investedValue || 0;
                        existingInstrument = existingGoal.investedInstrument || "";
                    }
                }

                let goalData = {
                    id: this.editingId || Date.now().toString(),
                    type: type,
                    name: name,
                    inflation: inflation,
                    investedValue: existingInvested,
                    investedInstrument: existingInstrument
                };

                if (type === 'standard') {
                    goalData.currentValue = parseFloat(document.getElementById('currentValue').value);
                    goalData.years = parseInt(document.getElementById('years').value);
                    
                    goalData.presentValue = goalData.currentValue;
                    goalData.targetValue = goalData.currentValue * Math.pow((1 + (inflation / 100)), goalData.years);
                    goalData.instrument = this.suggestInstrument(type, goalData.years);
                } 
                else if (type === 'retirement') {
                    goalData.monthlyExpenses = parseFloat(document.getElementById('monthlyExpenses').value);
                    goalData.yearsToRetire = parseInt(document.getElementById('yearsToRetire').value);
                    goalData.yearsInRetirement = parseInt(document.getElementById('yearsInRetirement').value);
                    goalData.postRetirementReturn = parseFloat(document.getElementById('postRetirementReturn').value);
                    
                    goalData.presentValue = this.calcRetirementPV(goalData.monthlyExpenses, goalData.yearsInRetirement, inflation, goalData.postRetirementReturn);
                    goalData.targetValue = this.calcRetirementFV(goalData.monthlyExpenses, goalData.yearsToRetire, goalData.yearsInRetirement, inflation, goalData.postRetirementReturn);
                    goalData.instrument = this.suggestInstrument(type, goalData.yearsToRetire);
                } 
                else if (type === 'education') {
                    goalData.children = parseInt(document.getElementById('eduChildren').value);
                    goalData.grade = parseInt(document.getElementById('eduGrade').value);
                    goalData.currentFees = parseFloat(document.getElementById('eduCurrentFees').value);
                    goalData.cost11_12 = parseFloat(document.getElementById('eduCost11_12').value || 0);
                    goalData.costDegree = parseFloat(document.getElementById('eduCostDegree').value || 0);
                    goalData.costHigher = parseFloat(document.getElementById('eduCostHigher').value || 0);
                    
                    goalData.presentValue = this.calcEducationPV(goalData.children, goalData.grade, goalData.currentFees, goalData.cost11_12, goalData.costDegree, goalData.costHigher);
                    goalData.targetValue = this.calcEducationFV(goalData.children, goalData.grade, goalData.currentFees, inflation, goalData.cost11_12, goalData.costDegree, goalData.costHigher);
                    
                    const yearsToDegree = Math.max(0, 13 - goalData.grade);
                    goalData.instrument = this.suggestInstrument(type, yearsToDegree);
                }

                if (this.editingId) {
                    const index = this.goals.findIndex(g => g.id === this.editingId);
                    this.goals[index] = goalData;
                } else {
                    this.goals.push(goalData);
                }

                this.saveState();
                this.cancelEdit();
                this.render();
            },

            editGoal(id) {
                const goal = this.goals.find(g => g.id === id);
                if (!goal) return;

                this.editingId = id;
                document.getElementById('formTitle').innerText = "Edit Goal";
                document.getElementById('submitBtn').innerText = "Update Goal";
                document.getElementById('cancelBtn').style.display = "block";
                window.scrollTo({ top: 0, behavior: 'smooth' });

                document.getElementById('goalType').value = goal.type;
                this.toggleFormFields();
                document.getElementById('goalName').value = goal.name;
                document.getElementById('inflation').value = goal.inflation;

                if (goal.type === 'standard') {
                    document.getElementById('currentValue').value = goal.currentValue;
                    document.getElementById('years').value = goal.years;
                } else if (goal.type === 'retirement') {
                    document.getElementById('monthlyExpenses').value = goal.monthlyExpenses;
                    document.getElementById('yearsToRetire').value = goal.yearsToRetire;
                    document.getElementById('yearsInRetirement').value = goal.yearsInRetirement;
                    document.getElementById('postRetirementReturn').value = goal.postRetirementReturn;
                } else if (goal.type === 'education') {
                    document.getElementById('eduChildren').value = goal.children;
                    document.getElementById('eduGrade').value = goal.grade;
                    document.getElementById('eduCurrentFees').value = goal.currentFees;
                    document.getElementById('eduCost11_12').value = goal.cost11_12;
                    document.getElementById('eduCostDegree').value = goal.costDegree;
                    document.getElementById('eduCostHigher').value = goal.costHigher;
                }
            },

            cancelEdit() {
                this.editingId = null;
                document.getElementById('formTitle').innerText = "Define New Goal";
                document.getElementById('submitBtn').innerText = "Calculate & Save";
                document.getElementById('cancelBtn').style.display = "none";
                document.getElementById('goalForm').reset();
                this.toggleFormFields();
            },

            deleteGoal(id) {
                if(confirm("Are you sure you want to delete this goal?")) {
                    this.goals = this.goals.filter(goal => goal.id !== id);
                    if(this.editingId === id) this.cancelEdit();
                    this.saveState();
                    this.render();
                }
            },

            // Modal Logic
            openModal(id) {
                const goal = this.goals.find(g => g.id === id);
                if (!goal) return;

                document.getElementById('modalGoalId').value = goal.id;
                document.getElementById('modalGoalName').innerText = `Track: ${goal.name}`;
                document.getElementById('investAmount').value = goal.investedValue || '';
                document.getElementById('investInstrument').value = goal.investedInstrument || '';
                
                document.getElementById('investModal').style.display = 'flex';
            },

            closeModal() {
                document.getElementById('investModal').style.display = 'none';
                document.getElementById('investForm').reset();
            },

            saveInvestment(event) {
                event.preventDefault();
                const id = document.getElementById('modalGoalId').value;
                const amount = parseFloat(document.getElementById('investAmount').value);
                const instrument = document.getElementById('investInstrument').value;

                const index = this.goals.findIndex(g => g.id === id);
                if (index > -1) {
                    this.goals[index].investedValue = amount;
                    this.goals[index].investedInstrument = instrument;
                    this.saveState();
                    this.render();
                    this.closeModal();
                }
            },

            saveState() {
                localStorage.setItem('ananthaGoalsV1_6', JSON.stringify(this.goals));
            },

            render() {
                const container = document.getElementById('goalsContainer');
                container.innerHTML = ''; 

                if (this.goals.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-secondary);">No goals defined yet. Create one to get started.</p>';
                    return;
                }

                this.goals.forEach(goal => {
                    const card = document.createElement('div');
                    
                    let typeClass = '';
                    let badgeLabel = 'Standard';
                    if (goal.type === 'retirement') { typeClass = 'retirement-type'; badgeLabel = 'Retirement'; }
                    if (goal.type === 'education') { typeClass = 'education-type'; badgeLabel = 'Education'; }
                    
                    card.className = `goal-card ${typeClass}`;
                    // Trigger modal click
                    card.onclick = () => this.openModal(goal.id);
                    
                    let statsHTML = '';
                    if (goal.type === 'standard') {
                        statsHTML = `
                            <div class="goal-stat"><span>Timeline:</span><span>${goal.years} Years</span></div>
                            <div class="goal-stat"><span>Expected Inflation:</span><span>${goal.inflation}% YoY</span></div>
                        `;
                    } else if (goal.type === 'retirement') {
                        statsHTML = `
                            <div class="goal-stat"><span>Retiring In:</span><span>${goal.yearsToRetire} Years</span></div>
                            <div class="goal-stat"><span>Retirement Duration:</span><span>${goal.yearsInRetirement} Years</span></div>
                        `;
                    } else if (goal.type === 'education') {
                        statsHTML = `
                            <div class="goal-stat"><span>Children / Grade:</span><span>${goal.children} Kids / ${goal.grade}th Std</span></div>
                            <div class="goal-stat"><span>Fee Inflation:</span><span>${goal.inflation}% YoY</span></div>
                        `;
                    }

                    const instrumentText = goal.instrument || "Portfolio matching recommended based on timeline.";

                    // Check for existing investments
                    let investmentHTML = '';
                    if (goal.investedValue && goal.investedValue > 0) {
                        let percent = ((goal.investedValue / goal.targetValue) * 100).toFixed(1);
                        investmentHTML = `
                            <div class="investment-status">
                                <div class="investment-header">
                                    <span>Currently Invested</span>
                                    <span class="investment-amount">${this.formatCurrency(goal.investedValue)} (${percent}%)</span>
                                </div>
                                <div class="user-instrument">Via: ${goal.investedInstrument}</div>
                            </div>
                        `;
                    } else {
                        investmentHTML = `
                            <div class="investment-status" style="background: transparent; border: 1px dashed var(--border-color); text-align: center; color: var(--text-secondary);">
                                + Click to track invested amount
                            </div>
                        `;
                    }

                    // Protect edit/delete buttons from triggering the card modal click
                    card.innerHTML = `
                        <div class="goal-header">
                            <div class="goal-title">
                                ${goal.name}
                                <span class="goal-type-badge">${badgeLabel}</span>
                            </div>
                            <div class="card-actions">
                                <button class="icon-btn" onclick="event.stopPropagation(); app.editGoal('${goal.id}')" title="Edit Goal">✎</button>
                                <button class="icon-btn delete" onclick="event.stopPropagation(); app.deleteGoal('${goal.id}')" title="Delete Goal">✕</button>
                            </div>
                        </div>
                        ${statsHTML}
                        
                        <div class="instrument-box">
                            <span>Suggested Strategy</span>
                            <strong>${instrumentText}</strong>
                        </div>

                        ${investmentHTML}

                        <div class="value-tiers">
                            <div class="value-tier">
                                <span>Value Required (Today's ₹)</span>
                                <div class="tier-value pv">${this.formatCurrency(goal.presentValue || goal.currentValue)}</div>
                            </div>
                            <div class="value-tier">
                                <span>Projected Future Target</span>
                                <div class="tier-value fv">${this.formatCurrency(goal.targetValue)}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        };

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('investModal');
            if (event.target === modal) {
                app.closeModal();
            }
        }

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
