<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anantha | Wealth OS V2.4</title>
    <!-- SheetJS Library for reading Excel files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --surface-color: #1a1d24;
            --surface-light: #252a34;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --danger-color: #f43f5e;
            --warning-color: #fbbf24;
            --edu-color: #a78bfa;
            --success-color: #34d399;
            --border-color: #2dd4bf20;
            --font-family: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 2rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand-name { font-size: 1.5rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        
        .profile-manager {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--surface-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        .profile-manager select {
            background: transparent;
            color: var(--text-primary);
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }
        
        .profile-manager button {
            width: auto;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            background: var(--surface-light);
            color: var(--accent-color);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Navigation Tabs */
        .nav-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); overflow-x: auto; }
        .tab-btn { background: transparent; border: none; color: var(--text-secondary); padding: 1rem 1.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; border-radius: 0; white-space: nowrap; transition: color 0.2s; }
        .tab-btn.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }
        .tab-btn:hover:not(.active) { color: var(--text-primary); }
        
        .view { display: none; animation: fadeIn 0.3s ease-in-out; }
        .view.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Layouts */
        .dashboard-layout { display: grid; grid-template-columns: 350px 1fr; gap: 2rem; }
        .summary-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        
        @media (max-width: 900px) {
            .dashboard-layout { grid-template-columns: 1fr; }
        }

        /* Forms */
        .form-card { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; height: fit-content; }
        .form-card h2 { font-size: 1.1rem; margin-bottom: 1.5rem; color: var(--accent-color); }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.875rem; color: var(--text-secondary); }
        .form-group input, .form-group select { width: 100%; background: var(--surface-light); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.75rem; border-radius: 4px; font-family: inherit; color-scheme: dark; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent-color); }
        .form-actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
        .row-group { display: flex; gap: 1rem; }
        .row-group > div { flex: 1; }

        button { width: 100%; background-color: var(--accent-color); color: #000; border: none; padding: 0.75rem; border-radius: 4px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-cancel { background-color: var(--surface-light); color: var(--text-primary); border: 1px solid var(--border-color); display: none; }
        .btn-action { width: auto; flex: 1; }

        /* Investment Cards */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .card { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; }
        
        .inv-card.equity-type { border-left: 4px solid var(--accent-color); }
        .inv-card.hybrid-type { border-left: 4px solid var(--edu-color); }
        .inv-card.assets-type { border-left: 4px solid var(--warning-color); }
        .inv-card.fd-type, .inv-card.rd-type, .inv-card.ppf-type, .inv-card.pomis-type, .inv-card.debt-type { border-left: 4px solid var(--success-color); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--surface-light); }
        .card-title { font-weight: 600; font-size: 1.1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
        .badge { font-size: 0.7rem; background: var(--surface-light); padding: 0.2rem 0.5rem; border-radius: 4px; color: var(--text-secondary); vertical-align: middle; text-transform: uppercase;}
        .badge.profile-badge { background: var(--accent-color); color: #000; font-weight: 600; }
        
        .card-actions { display: flex; gap: 0.75rem; z-index: 10; }
        .icon-btn { background: none; color: var(--text-secondary); width: auto; padding: 0; font-size: 1.1rem; }
        .icon-btn:hover { color: var(--accent-color); }
        .icon-btn.delete:hover { color: var(--danger-color); }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .stat-row span:first-child { color: var(--text-secondary); }

        .value-tiers { display: flex; flex-direction: column; gap: 1rem; padding-top: 1rem; border-top: 1px dotted var(--surface-light); }
        .value-tier { display: flex; justify-content: space-between; align-items: flex-end; }
        .value-tier span { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }
        .tier-value { font-weight: 700; }
        .tier-value.pv { font-size: 1.1rem; color: var(--text-primary); }
        .tier-value.fv { font-size: 1.4rem; color: var(--accent-color); }

        /* Dashboard specific */
        .dash-stat-card { text-align: center; justify-content: center; align-items: center; padding: 1.5rem 1rem; }
        .dash-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
        .dash-value { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
        .dash-value.highlight { color: var(--accent-color); }
        .dash-value.success { color: var(--success-color); }

        .progress-container { margin-top: 1rem; background: var(--surface-color); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-color); }
        .progress-bar-bg { width: 100%; height: 20px; background: var(--surface-light); border-radius: 10px; overflow: hidden; margin-top: 1rem; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--success-color), var(--accent-color)); width: 0%; transition: width 1s ease-in-out; }

        /* Goal Data Table */
        .table-container { width: 100%; overflow-x: auto; background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; }
        .data-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .data-table th, .data-table td { padding: 1.25rem 1rem; text-align: right; border-bottom: 1px solid var(--surface-light); }
        .data-table th:first-child, .data-table td:first-child { text-align: left; }
        .data-table th { background: var(--surface-light); color: var(--text-secondary); font-weight: 600; font-size: 0.85rem; }
        .data-table td { font-size: 1rem; }
        .data-table tr:hover:not(.total-row) { background-color: rgba(255, 255, 255, 0.02); }
        .data-table tr:last-child td { border-bottom: none; }
        
        .goal-name-cell { font-weight: 600; color: var(--text-primary); }
        
        .data-table .total-row { font-weight: 700; background-color: var(--surface-light); color: var(--text-primary); }
        .data-table .total-row td { border-top: 2px solid var(--border-color); font-size: 1.1rem; }
        .data-table .highlight-val { color: var(--accent-color); font-weight: 600; }

        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: var(--surface-color); padding: 2rem; border-radius: 8px; width: 90%; max-width: 400px; border: 1px solid var(--border-color); position: relative; }
        .modal-content h3 { margin-bottom: 1.5rem; color: var(--accent-color); font-size: 1.2rem; }
        .close-modal { position: absolute; top: 1rem; right: 1rem; background: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; border: none; padding: 0; width: auto; }
        .close-modal:hover { color: var(--danger-color); }
        
        .portfolio-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; flex-wrap: wrap; gap: 1rem;}
        .portfolio-header h3 { font-size: 1.2rem; color: var(--text-primary); font-weight: 600; margin: 0; }
        .btn-upload { background-color: var(--surface-light); color: var(--text-primary); border: 1px solid var(--border-color); font-weight: 500; width: auto; padding: 0.4rem 1rem; font-size: 0.85rem;}
        .btn-upload:hover { border-color: var(--accent-color); }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">Anantha</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="app.switchView('home')">Dashboard Summary</button>
        <button class="tab-btn" onclick="app.switchView('goals')">Financial Goals / Plan</button>
        <button class="tab-btn" onclick="app.switchView('investments')">Asset Portfolio</button>
    </div>

    <!-- VIEW: HOME DASHBOARD -->
    <div id="view-home" class="view active">
        <div class="summary-layout">
            <div class="card dash-stat-card">
                <div class="dash-label">Assets (Today)</div>
                <div class="dash-value success" id="dashTotalAssets">₹0</div>
            </div>
            <div class="card dash-stat-card">
                <div class="dash-label">Projected Asset FV</div>
                <div class="dash-value success" id="dashFutureAssets">₹0</div>
            </div>
            <div class="card dash-stat-card">
                <div class="dash-label">Plan C. Expenses</div>
                <div class="dash-value" id="dashTotalPV">₹0</div>
            </div>
            <div class="card dash-stat-card">
                <div class="dash-label">Total Goal Required</div>
                <div class="dash-value highlight" id="dashTotalFV">₹0</div>
            </div>
        </div>

        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h3 style="margin-bottom: 0.2rem;">Wealth Progression</h3>
                    <span style="font-size: 0.85rem; color: var(--text-secondary);">Projected Future Assets vs Future Goals Target</span>
                </div>
                <div id="dashPercentage" style="font-size: 1.2rem; font-weight: 700; color: var(--accent-color);">0%</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="dashProgressBar"></div>
            </div>
        </div>
    </div>
    
    <!-- VIEW: GOALS (TABLE FORMAT) -->
    <div id="view-goals" class="view">
        <div class="dashboard-layout">
            <aside class="form-card">
                <h2 id="goalFormTitle">Define Target Goal</h2>
                <form id="goalForm" onsubmit="app.handleGoalSave(event)">
                    <div class="form-group">
                        <label for="goalType">Goal Type</label>
                        <select id="goalType" onchange="app.toggleGoalFields()">
                            <option value="standard">Standard Financial Goal</option>
                            <option value="retirement">Retirement Corpus</option>
                            <option value="education">Kids Education Timeline</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="goalName">Goal Name</label>
                        <input type="text" id="goalName" required placeholder="e.g., Higher Education">
                    </div>

                    <div id="standardFields">
                        <div class="form-group">
                            <label for="currentValue">C. Expenses (Current Value ₹)</label>
                            <input type="number" id="currentValue" placeholder="1000000" min="0" step="any">
                        </div>
                        <div class="form-group">
                            <label for="years">Years Till Closure</label>
                            <input type="number" id="years" placeholder="8" min="1" max="100">
                        </div>
                    </div>

                    <div id="retirementFields" style="display: none;">
                        <div class="form-group">
                            <label for="monthlyExpenses">Current Monthly Expenses (₹)</label>
                            <input type="number" id="monthlyExpenses" placeholder="50000" min="0" step="any">
                        </div>
                        <div class="form-group">
                            <label for="yearsToRetire">Years To Retirement</label>
                            <input type="number" id="yearsToRetire" placeholder="15" min="1" max="50">
                        </div>
                        <div class="form-group">
                            <label for="yearsInRetirement">Years In Retirement (Duration)</label>
                            <input type="number" id="yearsInRetirement" placeholder="25" min="1" max="50">
                        </div>
                        <div class="form-group">
                            <label for="postRetirementReturn">Expected Post-Retirement Return (%)</label>
                            <input type="number" id="postRetirementReturn" placeholder="8" min="0" max="100" step="0.1">
                        </div>
                    </div>

                    <div id="educationFields" style="display: none;">
                        <div class="form-group row-group">
                            <div>
                                <label for="eduChildren">No. of Children</label>
                                <input type="number" id="eduChildren" value="2" min="1" max="10">
                            </div>
                            <div>
                                <label for="eduGrade">Current Grade (1-12)</label>
                                <input type="number" id="eduGrade" value="4" min="1" max="12">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="eduCurrentFees">Yearly Fees (per child) (₹)</label>
                            <input type="number" id="eduCurrentFees" placeholder="150000" min="0" step="any">
                        </div>
                        <div class="form-group">
                            <label for="eduCost11_12">11th & 12th Cost (Today's ₹/child)</label>
                            <input type="number" id="eduCost11_12" placeholder="400000" min="0" step="any">
                        </div>
                        <div class="form-group">
                            <label for="eduCostDegree">Degree Total Cost (Today's ₹/child)</label>
                            <input type="number" id="eduCostDegree" placeholder="1500000" min="0" step="any">
                        </div>
                        <div class="form-group">
                            <label for="eduCostHigher">Higher Studies (Today's ₹/child)</label>
                            <input type="number" id="eduCostHigher" placeholder="2500000" min="0" step="any">
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="inflationLabel" for="inflation">Inflation (%)</label>
                        <input type="number" id="inflation" required placeholder="10" min="0" max="100" step="0.1">
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="goalSubmitBtn" class="btn-action">Calculate & Save</button>
                        <button type="button" id="goalCancelBtn" class="btn-cancel btn-action" onclick="app.cancelGoalEdit()">Cancel</button>
                    </div>
                </form>
            </aside>
            <main>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Goal</th>
                                <th>Year</th>
                                <th>C. Expenses</th>
                                <th>Inflation</th>
                                <th>Goal Required</th>
                                <th style="text-align: center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="goalsTableBody">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- VIEW: INVESTMENTS -->
    <div id="view-investments" class="view">
        <div class="dashboard-layout">
            <aside class="form-card">
                <h2 id="invFormTitle">Log New Asset</h2>
                <form id="invForm" onsubmit="app.handleInvSave(event)">
                    
                    <div class="form-group">
                        <label for="invProfile">Owner / Profile</label>
                        <select id="invProfile">
                            <!-- Injected by JS -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="invType">Asset Class</label>
                        <select id="invType" onchange="app.handleInvTypeChange()">
                            <option value="equity">Equity (MFs, Stocks)</option>
                            <option value="fd">Fixed Deposit (FD)</option>
                            <option value="rd">Recurring Deposit (RD)</option>
                            <option value="ppf">Public Provident Fund (PPF)</option>
                            <option value="pomis">Post Office MIS</option>
                            <option value="debt">Other Debt / Bonds</option>
                            <option value="hybrid">Hybrid / Balanced</option>
                            <option value="assets">Physical Assets (Real Estate, Gold)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="invName">Instrument Name / Bank</label>
                        <input type="text" id="invName" required placeholder="e.g., SBI FD, HDFC Flexi-Cap">
                    </div>
                    
                    <div class="form-group">
                        <label for="invValue">Current Valuation (₹)</label>
                        <input type="number" id="invValue" required placeholder="500000" min="0" step="any">
                    </div>

                    <div class="row-group">
                        <div class="form-group">
                            <label for="invGrowth">Expected YoY Growth (%)</label>
                            <input type="number" id="invGrowth" required placeholder="7.1" min="0" max="100" step="0.1" value="12.0">
                        </div>
                        <div class="form-group">
                            <label for="invMaturity">Maturity Date (Optional)</label>
                            <input type="date" id="invMaturity">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="invSubmitBtn" class="btn-action">Save Asset</button>
                        <button type="button" id="invCancelBtn" class="btn-cancel btn-action" onclick="app.cancelInvEdit()">Cancel</button>
                    </div>
                </form>
            </aside>
            <main>
                <div class="portfolio-header">
                    <h3>Registered Assets</h3>
                    <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                        <input type="file" id="bulkUpload" accept=".xlsx, .xls" style="display:none;" onchange="app.handleBulkUpload(event)">
                        <button class="btn-upload" onclick="if(confirm('Warning: This will delete ALL current assets and replace them with the uploaded template. Continue?')) document.getElementById('bulkUpload').click()">
                            ⬆ Upload holdings-family-template.xlsx
                        </button>
                        <div class="profile-manager">
                            <select id="assetProfileFilter" onchange="app.renderInvestments()">
                                <!-- Injected by JS -->
                            </select>
                            <button onclick="app.openProfileModal()">+ New Profile</button>
                        </div>
                    </div>
                </div>
                <div class="grid-container" id="investmentsContainer">
                    <!-- Investment cards injected here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-content">
            <button class="close-modal" onclick="app.closeProfileModal()">✕</button>
            <h3>Create Asset Profile</h3>
            <form onsubmit="app.createProfile(event)">
                <div class="form-group">
                    <label for="newProfileName">Profile / Owner Name</label>
                    <input type="text" id="newProfileName" required placeholder="e.g., Anju, Family, Twins">
                </div>
                <button type="submit" style="background-color: var(--success-color);">Add Profile</button>
            </form>
        </div>
    </div>

    <script>
        const app = {
            data: {
                profiles: ['Main Portfolio'],
                goals: [],
                investments: []
            },
            editingGoalId: null,
            editingInvId: null,
            currentYear: new Date().getFullYear(),

            defaultRates: { equity: 12.0, fd: 7.0, rd: 6.8, ppf: 7.1, pomis: 7.4, debt: 7.0, hybrid: 10.0, assets: 5.0 },

            init() {
                this.migrateData();
                this.updateProfileDropdowns();
                this.toggleGoalFields();
                this.renderAll();
            },

            migrateData() {
                const savedV2_4 = localStorage.getItem('ananthaDataV2_4');
                if (savedV2_4) {
                    this.data = JSON.parse(savedV2_4);
                    return;
                }

                // Migrate from older versions
                const savedOld = localStorage.getItem('ananthaDataV2_3');
                if (savedOld) {
                    this.data = JSON.parse(savedOld);
                    this.saveState();
                }
            },

            saveState() {
                localStorage.setItem('ananthaDataV2_4', JSON.stringify(this.data));
            },

            formatCurrency(amount) {
                if (isNaN(amount) || amount === null) return "0";
                return new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }).format(Math.round(amount));
            },

            parseCurrencyStr(val) {
                if (typeof val === 'number') return val;
                if (typeof val === 'string') {
                    const cleaned = val.replace(/,/g, '').replace(/[^0-9.-]/g, '');
                    return parseFloat(cleaned);
                }
                return NaN;
            },

            /* -------------------------------------------------------------------------- */
            /* PROFILE MANAGEMENT (ASSETS ONLY)                                           */
            /* -------------------------------------------------------------------------- */
            updateProfileDropdowns() {
                const formSelect = document.getElementById('invProfile');
                const filterSelect = document.getElementById('assetProfileFilter');
                
                const currentFormVal = formSelect.value;
                const currentFilterVal = filterSelect.value;
                
                formSelect.innerHTML = '';
                filterSelect.innerHTML = '<option value="ALL">All Profiles</option>';
                
                this.data.profiles.forEach(profileName => {
                    const formOpt = document.createElement('option');
                    formOpt.value = profileName;
                    formOpt.innerText = profileName;
                    formSelect.appendChild(formOpt);

                    const filterOpt = document.createElement('option');
                    filterOpt.value = profileName;
                    filterOpt.innerText = profileName;
                    filterSelect.appendChild(filterOpt);
                });
                
                if(currentFormVal && this.data.profiles.includes(currentFormVal)) formSelect.value = currentFormVal;
                if(currentFilterVal && (this.data.profiles.includes(currentFilterVal) || currentFilterVal === "ALL")) filterSelect.value = currentFilterVal;
            },

            openProfileModal() { document.getElementById('profileModal').style.display = 'flex'; document.getElementById('newProfileName').focus(); },
            closeProfileModal() { document.getElementById('profileModal').style.display = 'none'; document.getElementById('newProfileName').value = ''; },

            createProfile(event) {
                event.preventDefault();
                const name = document.getElementById('newProfileName').value.trim();
                
                if (name && !this.data.profiles.includes(name)) {
                    this.data.profiles.push(name);
                    this.saveState();
                    this.updateProfileDropdowns();
                    document.getElementById('invProfile').value = name;
                    this.closeProfileModal();
                } else {
                    alert("A profile with this name already exists.");
                }
            },

            switchView(viewId) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                
                document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
                document.getElementById(`view-${viewId}`).classList.add('active');

                if (viewId === 'home') this.renderDashboard();
            },

            /* -------------------------------------------------------------------------- */
            /* INVESTMENTS & BULK UPLOAD LOGIC                                            */
            /* -------------------------------------------------------------------------- */
            handleInvTypeChange() {
                const type = document.getElementById('invType').value;
                document.getElementById('invGrowth').value = this.defaultRates[type] || 0;
            },
            
            calcInvFV(val, rate, matDateStr) {
                if (!matDateStr || !rate) return val;
                const matDate = new Date(matDateStr);
                const today = new Date();
                const years = (matDate - today) / (1000 * 60 * 60 * 24 * 365.25);
                if (years <= 0) return val;
                return val * Math.pow(1 + (rate / 100), years);
            },

            handleInvSave(event) {
                event.preventDefault();
                const profile = document.getElementById('invProfile').value;
                const type = document.getElementById('invType').value;
                const val = parseFloat(document.getElementById('invValue').value);
                const rate = parseFloat(document.getElementById('invGrowth').value);
                const matDate = document.getElementById('invMaturity').value;

                let invData = {
                    id: this.editingInvId || Date.now().toString(),
                    profile: profile,
                    name: document.getElementById('invName').value,
                    type: type,
                    value: val,
                    growthRate: rate,
                    maturityDate: matDate,
                    futureValue: this.calcInvFV(val, rate, matDate)
                };

                if (this.editingInvId) {
                    const index = this.data.investments.findIndex(i => i.id === this.editingInvId);
                    this.data.investments[index] = invData;
                } else {
                    this.data.investments.push(invData);
                }

                this.saveState();
                this.cancelInvEdit();
                this.renderInvestments();
                this.renderDashboard();
            },

            editInv(id) {
                const inv = this.data.investments.find(i => i.id === id);
                if (!inv) return;
                
                this.editingInvId = id;
                document.getElementById('invFormTitle').innerText = "Edit Asset";
                document.getElementById('invSubmitBtn').innerText = "Update Asset";
                document.getElementById('invCancelBtn').style.display = "block";
                
                document.getElementById('invProfile').value = inv.profile || this.data.profiles[0];
                document.getElementById('invName').value = inv.name;
                document.getElementById('invType').value = inv.type;
                document.getElementById('invValue').value = inv.value;
                document.getElementById('invGrowth').value = inv.growthRate || this.defaultRates[inv.type];
                document.getElementById('invMaturity').value = inv.maturityDate || "";
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            cancelInvEdit() {
                this.editingInvId = null;
                document.getElementById('invFormTitle').innerText = "Log New Asset";
                document.getElementById('invSubmitBtn').innerText = "Save Asset";
                document.getElementById('invCancelBtn').style.display = "none";
                document.getElementById('invForm').reset();
                this.handleInvTypeChange(); 
            },

            deleteInv(id) {
                if(confirm("Delete this asset from your portfolio?")) {
                    this.data.investments = this.data.investments.filter(i => i.id !== id);
                    if(this.editingInvId === id) this.cancelInvEdit();
                    this.saveState();
                    this.renderInvestments();
                    this.renderDashboard();
                }
            },

            handleBulkUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    let newInvestments = [];
                    let newProfiles = new Set();
                    
                    workbook.SheetNames.forEach(sheetName => {
                        if (sheetName.toLowerCase().includes('report')) return;
                        
                        const worksheet = workbook.Sheets[sheetName];
                        const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                        
                        let headerRowIndex = -1;
                        for(let i=0; i<rows.length; i++) {
                            if(rows[i] && (rows[i].includes("First Name") || rows[i].includes("Investment"))) {
                                headerRowIndex = i;
                                break;
                            }
                        }
                        
                        if (headerRowIndex !== -1) {
                            const headers = rows[headerRowIndex];
                            for(let i = headerRowIndex + 1; i < rows.length; i++) {
                                const rowData = rows[i];
                                if(!rowData || rowData.length === 0) continue;
                                
                                let rowObj = {};
                                headers.forEach((h, idx) => {
                                    if(h) rowObj[h.toString().trim()] = rowData[idx];
                                });
                                
                                let mVal = this.parseCurrencyStr(rowObj["Market Value"]);
                                if(isNaN(mVal)) mVal = this.parseCurrencyStr(rowObj["Invested Amount"]);

                                if (rowObj["Investment"] && !isNaN(mVal)) {
                                    let profileName = rowObj["First Name"] ? rowObj["First Name"].toString().trim() : sheetName;
                                    newProfiles.add(profileName);
                                    
                                    let ac = (rowObj["Asset Class"] || rowObj["Asset Type"] || "").toString().toLowerCase();
                                    let invType = 'equity';
                                    if (ac.includes('debt')) invType = 'debt';
                                    else if (ac.includes('hybrid') || ac.includes('balanced')) invType = 'hybrid';
                                    else if (ac.includes('fd') || ac.includes('fixed')) invType = 'fd';
                                    else if (ac.includes('ppf')) invType = 'ppf';
                                    else if (ac.includes('gold') || ac.includes('property') || ac.includes('real estate')) invType = 'assets';
                                    
                                    let rate = this.defaultRates[invType] || 7.0;

                                    newInvestments.push({
                                        id: Date.now().toString() + Math.random().toString().slice(2,8),
                                        profile: profileName,
                                        name: rowObj["Investment"],
                                        type: invType,
                                        value: mVal,
                                        growthRate: rate,
                                        maturityDate: "",
                                        futureValue: this.calcInvFV(mVal, rate, "")
                                    });
                                }
                            }
                        }
                    });
                    
                    if(newInvestments.length > 0) {
                        this.data.investments = newInvestments; // Purges existing
                        
                        newProfiles.forEach(p => {
                            if(!this.data.profiles.includes(p)) {
                                this.data.profiles.push(p);
                            }
                        });
                        
                        this.saveState();
                        this.updateProfileDropdowns();
                        this.renderInvestments();
                        this.renderDashboard();
                        alert(`Successfully imported ${newInvestments.length} assets from the template!`);
                    } else {
                        alert("No valid asset data found in the template. Please ensure columns like 'First Name', 'Investment', and 'Market Value' exist.");
                    }
                };
                reader.readAsArrayBuffer(file);
                event.target.value = ''; // Reset file input
            },

            renderInvestments() {
                const container = document.getElementById('investmentsContainer');
                container.innerHTML = '';
                
                const filterVal = document.getElementById('assetProfileFilter').value;
                let filteredInvestments = this.data.investments;
                
                if(filterVal !== "ALL") {
                    filteredInvestments = this.data.investments.filter(i => i.profile === filterVal);
                }

                if (filteredInvestments.length === 0) {
                    container.innerHTML = `<p style="color: var(--text-secondary);">No assets logged${filterVal !== "ALL" ? " for " + filterVal : ""}.</p>`;
                    return;
                }

                filteredInvestments.forEach(inv => {
                    const card = document.createElement('div');
                    card.className = `card inv-card ${inv.type}-type`;
                    
                    let fv = this.calcInvFV(inv.value, inv.growthRate, inv.maturityDate);
                    
                    let dateDisplay = "N/A";
                    if (inv.maturityDate) {
                        const d = new Date(inv.maturityDate);
                        dateDisplay = d.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
                    }
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-title">
                                ${inv.name} 
                                <span class="badge">${inv.type}</span>
                                <span class="badge profile-badge">${inv.profile || 'Main'}</span>
                            </div>
                            <div class="card-actions">
                                <button class="icon-btn" onclick="app.editInv('${inv.id}')">✎</button>
                                <button class="icon-btn delete" onclick="app.deleteInv('${inv.id}')">✕</button>
                            </div>
                        </div>
                        
                        <div class="stat-row"><span>Growth Rate:</span><span style="color: var(--success-color); font-weight: 600;">${inv.growthRate}% YoY</span></div>
                        <div class="stat-row"><span>Maturity Date:</span><span>${dateDisplay}</span></div>
                        
                        <div class="value-tiers" style="margin-top: auto;">
                            <div class="value-tier">
                                <span>Current Valuation</span>
                                <div class="tier-value pv">₹${this.formatCurrency(inv.value)}</div>
                            </div>
                            <div class="value-tier">
                                <span>Projected Future Value</span>
                                <div class="tier-value fv">₹${this.formatCurrency(fv)}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            },

            /* -------------------------------------------------------------------------- */
            /* GLOBAL GOALS LOGIC                                                         */
            /* -------------------------------------------------------------------------- */
            toggleGoalFields() {
                const type = document.getElementById('goalType').value;
                const standard = document.getElementById('standardFields');
                const retirement = document.getElementById('retirementFields');
                const education = document.getElementById('educationFields');

                document.getElementById('currentValue').required = false;
                document.getElementById('years').required = false;
                document.getElementById('monthlyExpenses').required = false;
                document.getElementById('yearsToRetire').required = false;
                document.getElementById('yearsInRetirement').required = false;
                document.getElementById('postRetirementReturn').required = false;
                document.getElementById('eduCurrentFees').required = false;
                document.getElementById('eduCostDegree').required = false;

                standard.style.display = 'none';
                retirement.style.display = 'none';
                education.style.display = 'none';

                if (type === 'standard') {
                    standard.style.display = 'block';
                    document.getElementById('currentValue').required = true;
                    document.getElementById('years').required = true;
                } else if (type === 'retirement') {
                    retirement.style.display = 'block';
                    document.getElementById('monthlyExpenses').required = true;
                    document.getElementById('yearsToRetire').required = true;
                    document.getElementById('yearsInRetirement').required = true;
                    document.getElementById('postRetirementReturn').required = true;
                } else if (type === 'education') {
                    education.style.display = 'block';
                    document.getElementById('eduCurrentFees').required = true;
                    document.getElementById('eduCostDegree').required = true;
                }
            },

            calcRetFV(exp, yrsTo, yRet, inf, ret) {
                const fExp = (exp*12) * Math.pow((1+(inf/100)), yrsTo);
                const r = ret/100, i = inf/100;
                const real = ((1+r)/(1+i))-1;
                return real <= 0 ? fExp*yRet : fExp * ((1-Math.pow(1+real, -yRet))/real) * (1+real);
            },
            
            calcEduFV(c, g, fees, inf, c11, cDeg, cHi) {
                const r = inf/100; let fee=fees, sch=0;
                for(let i=1; i<=Math.max(0,10-g); i++){ fee*=(1+r); sch+=fee; }
                const f11 = c11 ? c11*Math.pow(1+r, Math.max(0,11-g)) : 0;
                const fDeg = cDeg ? cDeg*Math.pow(1+r, Math.max(0,13-g)) : 0;
                const fHi = cHi ? cHi*Math.pow(1+r, Math.max(0,16-g)) : 0;
                return c * (sch + f11 + fDeg + fHi);
            },

            handleGoalSave(event) {
                event.preventDefault();
                const type = document.getElementById('goalType').value;
                const inf = parseFloat(document.getElementById('inflation').value);
                
                let goalData = {
                    id: this.editingGoalId || Date.now().toString(),
                    type: type,
                    name: document.getElementById('goalName').value,
                    inflation: inf
                };

                if (type === 'standard') {
                    goalData.cv = parseFloat(document.getElementById('currentValue').value);
                    goalData.yrs = parseInt(document.getElementById('years').value);
                    
                    goalData.cExp = goalData.cv; 
                    goalData.fv = goalData.cv * Math.pow((1+(inf/100)), goalData.yrs);
                    goalData.targetYear = this.currentYear + goalData.yrs;
                } else if (type === 'retirement') {
                    goalData.exp = parseFloat(document.getElementById('monthlyExpenses').value);
                    goalData.yTo = parseInt(document.getElementById('yearsToRetire').value);
                    goalData.yIn = parseInt(document.getElementById('yearsInRetirement').value);
                    goalData.pRet = parseFloat(document.getElementById('postRetirementReturn').value);
                    
                    goalData.cExp = goalData.exp * 12; 
                    goalData.fv = this.calcRetFV(goalData.exp, goalData.yTo, goalData.yIn, inf, goalData.pRet);
                    goalData.targetYear = this.currentYear + goalData.yTo;
                } else if (type === 'education') {
                    goalData.c = parseInt(document.getElementById('eduChildren').value);
                    goalData.g = parseInt(document.getElementById('eduGrade').value);
                    goalData.fees = parseFloat(document.getElementById('eduCurrentFees').value);
                    goalData.c11 = parseFloat(document.getElementById('eduCost11_12').value || 0);
                    goalData.cDeg = parseFloat(document.getElementById('eduCostDegree').value || 0);
                    goalData.cHi = parseFloat(document.getElementById('eduCostHigher').value || 0);
                    
                    goalData.cExp = (goalData.fees + (goalData.c11 || 0) + (goalData.cDeg || 0) + (goalData.cHi || 0)) * goalData.c;
                    goalData.fv = this.calcEduFV(goalData.c, goalData.g, goalData.fees, inf, goalData.c11, goalData.cDeg, goalData.cHi);
                    goalData.targetYear = this.currentYear + Math.max(0, 13 - goalData.g); 
                }

                if (this.editingGoalId) {
                    const idx = this.data.goals.findIndex(g => g.id === this.editingGoalId);
                    this.data.goals[idx] = goalData;
                } else {
                    this.data.goals.push(goalData);
                }

                this.saveState();
                this.cancelGoalEdit();
                this.renderGoals();
                this.renderDashboard();
            },

            editGoal(id) {
                const g = this.data.goals.find(g => g.id === id);
                if (!g) return;

                this.editingGoalId = id;
                document.getElementById('goalFormTitle').innerText = "Edit Goal";
                document.getElementById('goalSubmitBtn').innerText = "Update Goal";
                document.getElementById('goalCancelBtn').style.display = "block";
                
                document.getElementById('goalType').value = g.type;
                this.toggleGoalFields();
                document.getElementById('goalName').value = g.name;
                document.getElementById('inflation').value = g.inflation;

                if (g.type === 'standard') {
                    document.getElementById('currentValue').value = g.cv || g.cExp || g.pv || g.currentValue;
                    document.getElementById('years').value = g.yrs || (g.targetYear ? g.targetYear - this.currentYear : 0);
                } else if (g.type === 'retirement') {
                    document.getElementById('monthlyExpenses').value = g.exp;
                    document.getElementById('yearsToRetire').value = g.yTo;
                    document.getElementById('yearsInRetirement').value = g.yIn;
                    document.getElementById('postRetirementReturn').value = g.pRet;
                } else if (g.type === 'education') {
                    document.getElementById('eduChildren').value = g.c;
                    document.getElementById('eduGrade').value = g.g;
                    document.getElementById('eduCurrentFees').value = g.fees;
                    document.getElementById('eduCost11_12').value = g.c11;
                    document.getElementById('eduCostDegree').value = g.cDeg;
                    document.getElementById('eduCostHigher').value = g.cHi;
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            cancelGoalEdit() {
                this.editingGoalId = null;
                document.getElementById('goalFormTitle').innerText = "Define Target Goal";
                document.getElementById('goalSubmitBtn').innerText = "Calculate & Save";
                document.getElementById('goalCancelBtn').style.display = "none";
                document.getElementById('goalForm').reset();
                this.toggleGoalFields();
            },

            deleteGoal(id) {
                if(confirm("Remove this goal?")) {
                    this.data.goals = this.data.goals.filter(g => g.id !== id);
                    if(this.editingGoalId === id) this.cancelGoalEdit();
                    this.saveState();
                    this.renderGoals();
                    this.renderDashboard();
                }
            },

            renderGoals() {
                const tbody = document.getElementById('goalsTableBody');
                tbody.innerHTML = ''; 

                if (this.data.goals.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">No goals defined yet.</td></tr>`;
                    return;
                }

                let totalCExp = 0;
                let totalFV = 0;

                const sortedGoals = [...this.data.goals].sort((a, b) => (a.targetYear || this.currentYear) - (b.targetYear || this.currentYear));

                sortedGoals.forEach(goal => {
                    let cExp = goal.cExp || (goal.type === 'retirement' ? (goal.exp * 12) : (goal.type === 'education' ? ((goal.fees + (goal.c11||0) + (goal.cDeg||0) + (goal.cHi||0))*goal.c) : (goal.cv || goal.pv || 0)));
                    let fv = goal.fv || goal.targetValue || 0;
                    
                    let tYear = goal.targetYear;
                    if (!tYear) {
                        if (goal.type === 'standard') tYear = this.currentYear + (goal.yrs || 0);
                        else if (goal.type === 'retirement') tYear = this.currentYear + (goal.yTo || 0);
                        else if (goal.type === 'education') tYear = this.currentYear + Math.max(0, 13 - (goal.g || 0));
                        else tYear = this.currentYear;
                    }

                    totalCExp += cExp;
                    totalFV += fv;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div class="goal-name-cell">${goal.name}</div>
                        </td>
                        <td>${tYear}</td>
                        <td>${this.formatCurrency(cExp)}</td>
                        <td>${goal.inflation}%</td>
                        <td class="highlight-val">${this.formatCurrency(fv)}</td>
                        <td style="text-align: center;">
                            <button class="icon-btn" onclick="app.editGoal('${goal.id}')">✎</button>
                            <button class="icon-btn delete" onclick="app.deleteGoal('${goal.id}')">✕</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                const totalRow = document.createElement('tr');
                totalRow.className = 'total-row';
                totalRow.innerHTML = `
                    <td colspan="2">TOTAL</td>
                    <td>${this.formatCurrency(totalCExp)}</td>
                    <td></td>
                    <td class="highlight-val">${this.formatCurrency(totalFV)}</td>
                    <td></td>
                `;
                tbody.appendChild(totalRow);
            },

            /* -------------------------------------------------------------------------- */
            /* GLOBAL DASHBOARD LOGIC                                                     */
            /* -------------------------------------------------------------------------- */
            renderDashboard() {
                let totalInvestments = 0;
                let futureInvestments = 0;
                
                this.data.investments.forEach(inv => {
                    totalInvestments += (inv.value || 0);
                    futureInvestments += this.calcInvFV(inv.value, inv.growthRate, inv.maturityDate);
                });
                
                let totalCExp = 0;
                let totalFV = 0;
                this.data.goals.forEach(goal => {
                    let cExp = goal.cExp || (goal.type === 'retirement' ? (goal.exp * 12) : (goal.type === 'education' ? ((goal.fees + (goal.c11||0) + (goal.cDeg||0) + (goal.cHi||0))*goal.c) : (goal.cv || goal.pv || 0)));
                    totalCExp += cExp;
                    totalFV += (goal.fv || goal.targetValue || 0);
                });

                document.getElementById('dashTotalAssets').innerText = '₹' + this.formatCurrency(totalInvestments);
                document.getElementById('dashFutureAssets').innerText = '₹' + this.formatCurrency(futureInvestments);
                document.getElementById('dashTotalPV').innerText = '₹' + this.formatCurrency(totalCExp);
                document.getElementById('dashTotalFV').innerText = '₹' + this.formatCurrency(totalFV);

                let percentage = 0;
                if (totalFV > 0) {
                    percentage = Math.min((futureInvestments / totalFV) * 100, 100);
                }

                setTimeout(() => {
                    document.getElementById('dashPercentage').innerText = `${percentage.toFixed(1)}%`;
                    document.getElementById('dashProgressBar').style.width = `${percentage}%`;
                }, 100);
            },

            renderAll() {
                this.renderInvestments();
                this.renderGoals();
                this.renderDashboard();
            }
        };

        window.onclick = function(event) {
            const modal = document.getElementById('profileModal');
            if (event.target === modal) {
                app.closeProfileModal();
            }
        }

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
