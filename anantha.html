<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anantha | Private Portfolio V1.1</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --surface-color: #1a1d24;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --success-color: #34d399;
            --border-color: #2dd4bf20;
            --font-family: system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .currency-toggle select {
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-family: inherit;
            cursor: pointer;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .trend-positive {
            color: var(--success-color);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .data-list {
            list-style: none;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 500;
        }

        .item-value {
            color: var(--accent-color);
        }
        
        .alert-banner {
            background-color: rgba(56, 189, 248, 0.1);
            border-left: 4px solid var(--accent-color);
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 0 4px 4px 0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">Anantha</div>
        <div class="currency-toggle">
            <select id="currencySelector" onchange="app.updateCurrency()">
                <option value="INR">Base: INR (₹)</option>
                <option value="AUD">View: AUD ($)</option>
            </select>
        </div>
    </header>

    <div class="alert-banner" id="maturityAlert">
        <span><strong>Portfolio Alert:</strong> Asset maturity scheduled for current month. Review reinvestment allocation.</span>
        <button onclick="this.parentElement.style.display='none'" style="background:none;border:none;color:inherit;cursor:pointer;">✕</button>
    </div>

    <main class="dashboard-grid">
        <!-- Net Worth Card -->
        <div class="card">
            <div class="card-header">
                <span>Total Managed Assets</span>
            </div>
            <div class="card-value" id="totalAssets">₹0.00</div>
            <div class="trend-positive">↑ +2.4% this month</div>
        </div>

        <!-- Passive Income Streams -->
        <div class="card">
            <div class="card-header">
                <span>Yield Engines</span>
                <span>Monthly</span>
            </div>
            <ul class="data-list" id="yieldList">
                <!-- Populated by JS -->
            </ul>
        </div>

        <!-- Equities & Markets -->
        <div class="card">
            <div class="card-header">
                <span>Market Holdings</span>
                <span>NSE / Global</span>
            </div>
            <ul class="data-list" id="marketList">
                <!-- Populated by JS -->
            </ul>
        </div>
    </main>

    <script>
        // Anantha UI Logic - V1.1
        const app = {
            // Default initial state
            data: {
                settings: {
                    currency: 'INR'
                },
                assets: {
                    yieldStreams: [
                        { name: "Vehicle Lease Operations", value: 12500 },
                        { name: "Fixed Term Yield", value: 4200 }
                    ],
                    markets: [
                        { name: "Core Equities (FMCG)", value: 450000 },
                        { name: "Index Funds", value: 280000 }
                    ]
                }
            },

            // Format numbers based on selected currency
            formatCurrency(amount) {
                const isAUD = this.data.settings.currency === 'AUD';
                // Simple static conversion rate for UI demo purposes
                const rate = isAUD ? 0.018 : 1; 
                const converted = amount * rate;
                
                return new Intl.NumberFormat(isAUD ? 'en-AU' : 'en-IN', {
                    style: 'currency',
                    currency: isAUD ? 'AUD' : 'INR',
                    maximumFractionDigits: 0
                }).format(converted);
            },

            // Initialize app and load from localStorage
            init() {
                const savedData = localStorage.getItem('ananthaPortfolioState');
                if (savedData) {
                    this.data = JSON.parse(savedData);
                    document.getElementById('currencySelector').value = this.data.settings.currency;
                }
                this.render();
            },

            // Save state securely to local browser storage
            saveState() {
                localStorage.setItem('ananthaPortfolioState', JSON.stringify(this.data));
            },

            updateCurrency() {
                this.data.settings.currency = document.getElementById('currencySelector').value;
                this.saveState();
                this.render();
            },

            render() {
                // Calculate Total
                let total = 0;
                
                // Render Yield Streams
                const yieldContainer = document.getElementById('yieldList');
                yieldContainer.innerHTML = '';
                this.data.assets.yieldStreams.forEach(item => {
                    yieldContainer.innerHTML += `
                        <li class="data-item">
                            <span class="item-name">${item.name}</span>
                            <span class="item-value">${this.formatCurrency(item.value)}</span>
                        </li>
                    `;
                    total += item.value;
                });

                // Render Market Holdings
                const marketContainer = document.getElementById('marketList');
                marketContainer.innerHTML = '';
                this.data.assets.markets.forEach(item => {
                    marketContainer.innerHTML += `
                        <li class="data-item">
                            <span class="item-name">${item.name}</span>
                            <span class="item-value">${this.formatCurrency(item.value)}</span>
                        </li>
                    `;
                    total += item.value;
                });

                // Update Total Display
                document.getElementById('totalAssets').innerText = this.formatCurrency(total);
            }
        };

        // Boot the application
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
