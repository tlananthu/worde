<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Canvas - The Best App in the World</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 280px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .note-list {
            list-style: none;
            padding: 0;
            margin: 20px 0 0 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .note-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
        }

        .note-item:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .note-item.active {
            background: rgba(56, 189, 248, 0.2);
            border-left: 4px solid var(--accent);
        }

        /* Main Workspace */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        input.title-input {
            background: transparent;
            border: none;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 20px;
            outline: none;
        }

        textarea.content-area {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            resize: none;
            flex-grow: 1;
            outline: none;
            font-family: inherit;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        button.primary-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button.primary-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <aside>
        <h2>✨ Zenith Canvas</h2>
        <button class="primary-btn" onclick="createNewNote()">+ New Thought</button>
        <ul class="note-list" id="noteList">
            <!-- Dynamically populated notes -->
        </ul>
    </aside>

    <main>
        <input type="text" id="noteTitle" class="title-input" placeholder="Untitled Thought..." oninput="updateActiveNote()">
        <textarea id="noteContent" class="content-area" placeholder="Write your masterpiece here... (Auto-saves locally)" oninput="updateActiveNote()"></textarea>
        
        <div class="toolbar">
            <span id="wordCount">0 words</span>
            <span id="saveStatus">All changes saved</span>
        </div>
    </main>

    <script>
        let notes = JSON.parse(localStorage.getItem('zenith_notes')) || [
            { id: 1, title: 'Welcome to Zenith', content: 'This is your personal space to think, write, and create without distractions. Everything you type is automatically saved to your browser.' }
        ];
        let activeNoteId = notes[0] ? notes[0].id : null;

        const noteListEl = document.getElementById('noteList');
        const titleInput = document.getElementById('noteTitle');
        const contentArea = document.getElementById('noteContent');
        const wordCountEl = document.getElementById('wordCount');

        function renderNotes() {
            noteListEl.innerHTML = '';
            notes.forEach(note => {
                const li = document.createElement('li');
                li.className = `note-item ${note.id === activeNoteId ? 'active' : ''}`;
                li.textContent = note.title || 'Untitled';
                li.onclick = () => selectNote(note.id);
                noteListEl.appendChild(li);
            });
            
            const activeNote = notes.find(n => n.id === activeNoteId);
            if (activeNote) {
                titleInput.value = activeNote.title;
                contentArea.value = activeNote.content;
                updateWordCount(activeNote.content);
            }
        }

        function selectNote(id) {
            activeNoteId = id;
            renderNotes();
        }

        function createNewNote() {
            const newNote = {
                id: Date.now(),
                title: 'New Thought',
                content: ''
            };
            notes.unshift(newNote);
            activeNoteId = newNote.id;
            saveAndRender();
        }

        function updateActiveNote() {
            const activeNote = notes.find(n => n.id === activeNoteId);
            if (activeNote) {
                activeNote.title = titleInput.value;
                activeNote.content = contentArea.value;
                updateWordCount(activeNote.content);
                saveAndRender(false); // don't re-render entire list immediately to avoid focus loss on title
            }
        }

        function updateWordCount(text) {
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCountEl.textContent = `${words} word${words === 1 ? '' : 's'}`;
        }

        function saveAndRender(fullRender = true) {
            localStorage.setItem('zenith_notes', JSON.stringify(notes));
            if (fullRender) {
                renderNotes();
            }
        }

        // Initial render
        renderNotes();
    </script>
</body>
</html>
