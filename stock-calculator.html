<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Average Calculator</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #2563eb;
            --border: #e5e7eb;
            --success: #059669;
            --info-bg: #eff6ff;
            --info-border: #bfdbfe;
            --info-text: #1d4ed8;
            --focus-ring: rgba(37, 99, 235, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .calculator {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-align: center;
            color: var(--text-main);
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s;
            background-color: #f9fafb;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 1.5rem 0;
        }

        .result-container {
            text-align: center;
            background: #ecfdf5;
            padding: 1.5rem 1rem;
            border-radius: 12px;
            border: 1px solid #a7f3d0;
            margin-bottom: 1rem;
        }

        .result-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #065f46;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--success);
            margin: 0;
        }

        .purchase-cost-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--info-bg);
            border: 1px solid var(--info-border);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .purchase-cost-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--info-text);
        }

        .purchase-cost-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--info-text);
        }

        .details {
            display: flex;
            justify-content: space-between;
            padding: 0 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .detail-value {
            font-weight: 600;
            color: var(--text-main);
            margin-top: 0.35rem;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>Stock Average Calculator</h2>
        
        <div class="input-grid">
            <div class="input-group">
                <label for="currentQty">Current Quantity</label>
                <input type="number" id="currentQty" placeholder="e.g. 100" min="0" oninput="calculate()">
            </div>
            
            <div class="input-group">
                <label for="currentAvg">Current Average</label>
                <input type="number" id="currentAvg" placeholder="e.g. 150.50" min="0" step="0.01" oninput="calculate()">
            </div>
            
            <div class="input-group">
                <label for="plannedQty">Planned Quantity</label>
                <input type="number" id="plannedQty" placeholder="e.g. 50" min="0" oninput="calculate()">
            </div>
            
            <div class="input-group">
                <label for="currentPrice">Current Price</label>
                <input type="number" id="currentPrice" placeholder="e.g. 140.00" min="0" step="0.01" oninput="calculate()">
            </div>
        </div>

        <div class="divider"></div>

        <div class="result-container">
            <div class="result-label">New Average Price</div>
            <div class="result-value" id="newAverage">0.00</div>
        </div>

        <div class="purchase-cost-container">
            <span class="purchase-cost-label">Cost of New Purchase</span>
            <span class="purchase-cost-value" id="costOfPurchase">0.00</span>
        </div>

        <div class="details">
            <div class="detail-item">
                <span>Total Shares</span>
                <span class="detail-value" id="totalShares">0</span>
            </div>
            <div class="detail-item">
                <span>Total Investment</span>
                <span class="detail-value" id="totalInvestment">0.00</span>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            // Get values from inputs
            const currentQty = parseFloat(document.getElementById('currentQty').value) || 0;
            const currentAvg = parseFloat(document.getElementById('currentAvg').value) || 0;
            const plannedQty = parseFloat(document.getElementById('plannedQty').value) || 0;
            const currentPrice = parseFloat(document.getElementById('currentPrice').value) || 0;

            // Calculate totals
            const totalCurrentInvestment = currentQty * currentAvg;
            const costOfNewPurchase = plannedQty * currentPrice;
            
            const totalShares = currentQty + plannedQty;
            const totalInvestment = totalCurrentInvestment + costOfNewPurchase;
            
            // Calculate new average
            let newAverage = 0;
            if (totalShares > 0) {
                newAverage = totalInvestment / totalShares;
            }

            // Formatting options for currency
            const currencyFormat = {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            };

            // Update UI
            document.getElementById('newAverage').innerText = newAverage.toFixed(2);
            
            // Update Cost of New Purchase
            document.getElementById('costOfPurchase').innerText = costOfNewPurchase.toLocaleString('en-US', currencyFormat);
            
            // Update details block
            document.getElementById('totalShares').innerText = totalShares;
            document.getElementById('totalInvestment').innerText = totalInvestment.toLocaleString('en-US', currencyFormat);
        }
    </script>
</body>
</html>
