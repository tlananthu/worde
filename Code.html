<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio & Custom Language Creator</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --text-light: #d4d4d4;
            --accent: #007acc;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }
        #sidebar {
            width: 250px;
            background-color: var(--bg-panel);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
        }
        button:hover {
            background-color: #005f9e;
        }
        #fileList {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
        }
        #fileList li {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        #fileList li:hover {
            background-color: #37373d;
        }
        #main-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        #editor-bar {
            padding: 10px;
            background-color: var(--bg-panel);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #filename {
            padding: 5px;
            background: #3c3c3c;
            border: 1px solid #555;
            color: white;
            width: 200px;
        }
        #editor {
            flex-grow: 1;
            width: 100%;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            border: none;
            padding: 15px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        #output-area {
            height: 30%;
            background-color: #111;
            border-top: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        #output-console {
            flex-grow: 1;
            color: #4af626;
            font-family: monospace;
            overflow-y: auto;
            white-space: pre-wrap;
            margin: 0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <span>My Files</span>
            <button onclick="createNewFile()">+ New</button>
        </div>
        <ul id="fileList"></ul>
    </div>

    <div id="main-area">
        <div id="editor-bar">
            <input type="text" id="filename" placeholder="e.g. script.js or game.---">
            <button onclick="saveFile()">Save</button>
            <button onclick="runCode()" style="background-color: #28a745;">▶ Run</button>
        </div>
        
        <textarea id="editor" spellcheck="false" placeholder="Write your code here..."></textarea>
        
        <div id="output-area">
            <div style="font-weight: bold; margin-bottom: 5px; color: #888;">Console / Output</div>
            <pre id="output-console"></pre>
            <iframe id="html-output"></iframe>
        </div>
    </div>

    <script>
        // --- 1. IndexedDB Setup for Safe Storage ---
        let db;
        const dbName = "CodeStudioDB";
        
        const request = indexedDB.open(dbName, 1);
        
        request.onupgradeneeded = function(event) {
            db = event.target.result;
            // Create a table (object store) for our files
            if (!db.objectStoreNames.contains('files')) {
                db.createObjectStore('files', { keyPath: 'name' });
            }
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            loadFileList();
        };

        request.onerror = function(event) {
            console.error("Database error: " + event.target.error);
        };

        // --- 2. File Management Functions ---
        const editor = document.getElementById('editor');
        const filenameInput = document.getElementById('filename');
        const fileListEl = document.getElementById('fileList');

        function createNewFile() {
            filenameInput.value = "newfile.---";
            editor.value = "print \"Hello from my new language!\"\nset score 100\nprint score";
            clearOutput();
        }

        function saveFile() {
            const name = filenameInput.value.trim();
            const content = editor.value;
            
            if (!name) return alert("Please enter a file name!");

            const transaction = db.transaction(['files'], 'readwrite');
            const store = transaction.objectStore('files');
            
            store.put({ name: name, content: content });
            
            transaction.oncomplete = function() {
                loadFileList();
                printToConsole(`Saved ${name} successfully!`, "#007acc");
            };
        }

        function loadFileList() {
            const transaction = db.transaction(['files'], 'readonly');
            const store = transaction.objectStore('files');
            const request = store.getAll();

            request.onsuccess = function() {
                fileListEl.innerHTML = '';
                request.result.forEach(file => {
                    const li = document.createElement('li');
                    li.textContent = file.name;
                    li.onclick = () => openFile(file.name, file.content);
                    fileListEl.appendChild(li);
                });
            };
        }

        function openFile(name, content) {
            filenameInput.value = name;
            editor.value = content;
            clearOutput();
        }

        // --- 3. Execution Engine ---
        const consoleOut = document.getElementById('output-console');
        const htmlOut = document.getElementById('html-output');

        function clearOutput() {
            consoleOut.innerText = '';
            consoleOut.style.display = 'block';
            htmlOut.style.display = 'none';
        }

        function printToConsole(text, color = "#4af626") {
            const span = document.createElement('span');
            span.style.color = color;
            span.innerText = text + '\n';
            consoleOut.appendChild(span);
        }

        function runCode() {
            clearOutput();
            const name = filenameInput.value.trim();
            const code = editor.value;

            if (name.endsWith('.js')) {
                // Run JavaScript
                try {
                    // Overriding console.log temporarily to show in our app
                    const originalLog = console.log;
                    console.log = function(...args) {
                        printToConsole(args.join(' '));
                    };
                    
                    new Function(code)();
                    
                    console.log = originalLog; // restore
                } catch (err) {
                    printToConsole("JS Error: " + err.message, "red");
                }
            } 
            else if (name.endsWith('.html')) {
                // Run HTML
                consoleOut.style.display = 'none';
                htmlOut.style.display = 'block';
                htmlOut.srcdoc = code;
            } 
            else if (name.endsWith('.---')) {
                // Run Custom Language
                try {
                    runCustomLanguage(code);
                } catch (err) {
                    printToConsole("Custom Language Error: " + err.message, "red");
                }
            } 
            else {
                printToConsole("Unknown file extension. Use .js, .html, or .---", "yellow");
            }
        }

        // --- 4. YOUR CUSTOM PROGRAMMING LANGUAGE INTERPRETER ---
        // You can update this function to teach the computer new words and rules!
        function runCustomLanguage(code) {
            const lines = code.split('\n');
            let memory = {}; // This is where we store variables

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                // Ignore empty lines or comments starting with //
                if (line === "" || line.startsWith("//")) continue;

                // RULE 1: Printing to screen
                // Example: print "Hello" OR print myVar
                if (line.startsWith("print ")) {
                    let toPrint = line.substring(6).trim();
                    
                    if (toPrint.startsWith('"') && toPrint.endsWith('"')) {
                        // It's a text string
                        printToConsole(toPrint.slice(1, -1));
                    } else {
                        // It's a variable
                        if (memory[toPrint] !== undefined) {
                            printToConsole(memory[toPrint]);
                        } else {
                            printToConsole("Error: Variable '" + toPrint + "' not found.", "red");
                        }
                    }
                }
                
                // RULE 2: Setting a variable
                // Example: set score 10
                else if (line.startsWith("set ")) {
                    let parts = line.split(" ");
                    let varName = parts[1];
                    let value = parts.slice(2).join(" ");
                    
                    // If it's a number, save it as a number
                    if (!isNaN(value)) {
                        memory[varName] = Number(value);
                    } else {
                        memory[varName] = value.replace(/"/g, ''); // save as text
                    }
                }

                // RULE 3: Adding to a variable
                // Example: add score 5
                else if (line.startsWith("add ")) {
                    let parts = line.split(" ");
                    let varName = parts[1];
                    let amount = Number(parts[2]);
                    
                    if (memory[varName] !== undefined) {
                        memory[varName] += amount;
                    }
                }

                // ADD NEW RULES HERE!
                // Try adding a "multiply" command, or a "changeColor" command!
                
                else {
                    printToConsole("Syntax Error on line " + (i+1) + ": I don't understand '" + line + "'", "red");
                }
            }
        }
    </script>
</body>
</html>
