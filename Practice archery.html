<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GRAV-SHOT: ORBITAL SLINGSHOT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #0a0e1c 0%, #030509 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #fff;
      overflow: hidden;
    }
    #game-wrap {
      position: relative;
      border: 3px solid #ffaa00;
      box-shadow: 0 0 45px rgba(255, 170, 0, 0.3);
      border-radius: 8px;
      overflow: hidden;
      background: #020307;
      cursor: crosshair;
    }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 14px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      pointer-events: none;
      text-shadow: 2px 2px 0 #000;
    }
    .accent { color: #00e5ff; }
    .gold { color: #ffaa00; }
    #banner {
      position: absolute;
      top: 40%;
      width: 100%;
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #00e5ff;
      text-shadow: 0 0 20px #00e5ff, 3px 3px 0 #000;
      display: none;
      pointer-events: none;
    }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
    }
    .key { color: #ffaa00; font-weight: bold; }
  </style>
</head>
<body>

  <div id="game-wrap">
    <div id="hud">
      <div>SECTOR: <span id="val-sector" class="accent">1/3</span></div>
      <div>SHOTS: <span id="val-shots" class="gold">0</span></div>
      <div>CORE: <span id="val-status" class="accent">LOCKED</span></div>
    </div>
    <div id="banner">SECTOR CLEARED</div>
    <canvas id="canvas" width="640" height="400"></canvas>
  </div>

  <div class="hint">
    <span class="key">CLICK & DRAG</span> probe to slingshot &nbsp;|&nbsp;
    Use <span class="key">GRAVITY</span> of gravity wells to reach the warp gate &nbsp;|&nbsp;
    <span class="key">R</span> Reset
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, type = 'sine', dur = 0.1, vol = 0.08) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const LEVELS = [
      {
        start: { x: 80, y: 200 },
        target: { x: 560, y: 200, r: 18 },
        wells: [
          { x: 320, y: 200, mass: 1400, r: 24, pulse: 0 }
        ]
      },
      {
        start: { x: 70, y: 90 },
        target: { x: 560, y: 310, r: 18 },
        wells: [
          { x: 250, y: 160, mass: 1200, r: 20, pulse: 0 },
          { x: 420, y: 250, mass: 1500, r: 24, pulse: 1 }
        ]
      },
      {
        start: { x: 80, y: 320 },
        target: { x: 550, y: 90, r: 18 },
        wells: [
          { x: 220, y: 220, mass: 1600, r: 26, pulse: 0 },
          { x: 380, y: 140, mass: -900, r: 18, pulse: 2, repulsor: true },
          { x: 460, y: 290, mass: 1300, r: 22, pulse: 1 }
        ]
      }
    ];

    let currentLevel = 0;
    let shotsFired = 0;
    let isAiming = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    const probe = {
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      r: 5,
      active: false,
      trail: []
    };

    const particles = [];

    function loadLevel(idx) {
      currentLevel = idx;
      const lvl = LEVELS[currentLevel];
      probe.x = lvl.start.x;
      probe.y = lvl.start.y;
      probe.vx = 0;
      probe.vy = 0;
      probe.active = false;
      probe.trail = [];
      document.getElementById('val-sector').textContent = `${idx + 1}/${LEVELS.length}`;
      document.getElementById('val-status').textContent = 'READY';
      document.getElementById('banner').style.display = 'none';
    }

    function emitSparks(x, y, count, color) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 3.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 18 + Math.random() * 8,
          color
        });
      }
    }

    function resetProbe() {
      const lvl = LEVELS[currentLevel];
      probe.x = lvl.start.x;
      probe.y = lvl.start.y;
      probe.vx = 0;
      probe.vy = 0;
      probe.active = false;
      probe.trail = [];
      document.getElementById('val-status').textContent = 'STANDBY';
    }

    // Input Handling
    canvas.addEventListener('mousedown', e => {
      if (probe.active) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      if (Math.hypot(mx - probe.x, my - probe.y) < 30) {
        isAiming = true;
        dragStart = { x: probe.x, y: probe.y };
        dragCurrent = { x: mx, y: my };
      }
    });

    window.addEventListener('mousemove', e => {
      if (!isAiming) return;
      const rect = canvas.getBoundingClientRect();
      dragCurrent = {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    });

    window.addEventListener('mouseup', () => {
      if (!isAiming) return;
      isAiming = false;

      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 5) {
        const force = Math.min(dist, 140) * 0.075;
        const angle = Math.atan2(dy, dx);
        probe.vx = Math.cos(angle) * force;
        probe.vy = Math.sin(angle) * force;
        probe.active = true;
        shotsFired++;
        document.getElementById('val-shots').textContent = shotsFired;
        document.getElementById('val-status').textContent = 'IN TRANSIT';
        beep(360, 'triangle', 0.12, 0.1);
      }
    });

    window.addEventListener('keydown', e => {
      if (e.code === 'KeyR') resetProbe();
    });

    // Physics Engine
    function updatePhysics() {
      if (!probe.active) return;

      const lvl = LEVELS[currentLevel];

      // Gravity calculations: F = G * (m1 * m2) / r^2
      for (const well of lvl.wells) {
        const dx = well.x - probe.x;
        const dy = well.y - probe.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        if (dist < well.r + probe.r) {
          emitSparks(probe.x, probe.y, 20, well.repulsor ? '#00e5ff' : '#ff4444');
          beep(120, 'sawtooth', 0.2, 0.12);
          resetProbe();
          return;
        }

        const force = well.mass / Math.max(distSq, 400);
        probe.vx += (dx / dist) * force * 0.16;
        probe.vy += (dy / dist) * force * 0.16;
      }

      probe.x += probe.vx;
      probe.y += probe.vy;

      probe.trail.push({ x: probe.x, y: probe.y });
      if (probe.trail.length > 40) probe.trail.shift();

      // Check Bounds
      if (probe.x < 0 || probe.x > canvas.width || probe.y < 0 || probe.y > canvas.height) {
        resetProbe();
        return;
      }

      // Check Warp Gate Trigger
      const targetDist = Math.hypot(probe.x - lvl.target.x, probe.y - lvl.target.y);
      if (targetDist < lvl.target.r) {
        probe.active = false;
        emitSparks(lvl.target.x, lvl.target.y, 35, '#00e5ff');
        beep(880, 'sine', 0.25, 0.12);

        if (currentLevel < LEVELS.length - 1) {
          document.getElementById('val-status').textContent = 'WARPING';
          setTimeout(() => loadLevel(currentLevel + 1), 600);
        } else {
          document.getElementById('banner').style.display = 'block';
          document.getElementById('val-status').textContent = 'COMPLETE';
        }
      }
    }

    // Render Pipeline
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const lvl = LEVELS[currentLevel];

      // Background Starfield Grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw Gravity Wells & Influence Rings
      lvl.wells.forEach(well => {
        well.pulse += 0.04;
        const pulseR = well.r + Math.sin(well.pulse) * 3;

        ctx.strokeStyle = well.repulsor ? 'rgba(0, 229, 255, 0.25)' : 'rgba(255, 68, 68, 0.2)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(well.x, well.y, well.r * 3.2, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = well.repulsor ? '#00e5ff' : '#ff4444';
        ctx.beginPath();
        ctx.arc(well.x, well.y, pulseR, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Target Warp Gate
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(lvl.target.x, lvl.target.y, lvl.target.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(0, 229, 255, 0.15)';
      ctx.beginPath();
      ctx.arc(lvl.target.x, lvl.target.y, lvl.target.r, 0, Math.PI * 2);
      ctx.fill();

      // Slingshot Trajectory Vector
      if (isAiming) {
        ctx.strokeStyle = '#ffaa00';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(dragStart.x, dragStart.y);
        ctx.lineTo(dragCurrent.x, dragCurrent.y);
        ctx.stroke();

        // Target Vector Projection Indicator
        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;
        ctx.strokeStyle = 'rgba(255, 170, 0, 0.4)';
        ctx.setLineDash([2, 4]);
        ctx.beginPath();
        ctx.moveTo(dragStart.x, dragStart.y);
        ctx.lineTo(dragStart.x + dx * 1.5, dragStart.y + dy * 1.5);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Draw Probe Trail
      ctx.strokeStyle = 'rgba(255, 170, 0, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < probe.trail.length; i++) {
        const pt = probe.trail[i];
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      // Draw Probe
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.arc(probe.x, probe.y, probe.r, 0, Math.PI * 2);
      ctx.fill();

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function loop() {
      updatePhysics();
      draw();
      requestAnimationFrame(loop);
    }

    loadLevel(0);
    loop();
  </script>
</body>
</html>
